urs corrompues réparées avant sauvegarde.", "dBackup": "Le registre courant était endommagé ; le précédent a été restauré.", "dOffline": "Sans surveillance pendant {t} — {m} originés en votre absence.", "hShort": "h", "mShort": "min", "hoursWord": "heures", "minutesWord": "minutes", "mCatchTitle": "Rattrapage", "mCatch1": "Votre position satisfait déjà plusieurs étapes de la chaîne, qui se sont donc toutes ouvertes d'un coup :", "mCatch2": "À partir d'ici, elles s'ouvrent une par une, chacune depuis un palier de la précédente.", "mOpenTitle": "Ouverture — {n}", "mOpen1": "C'est votre travail dans {f} qui en a déclenché l'ouverture.", "mOpen2": "Un nouvel onglet est apparu. Rien ici n'est proposé avant de pouvoir servir, et rien de ce qui s'ouvre ne se referme jamais — jusqu'à ce que vous réémettiez la monnaie, auquel cas tout se referme d'un coup.", "mFineTitle": "Une transaction a été conclue", "mFine1": "L'autorité a relevé des positions irrégulières prises en amont de vos propres annonces de taux. Elle a prononcé une amende, n'a exigé aucune reconnaissance de faute et n'a nommé personne.", "mFinePaid": "Amende payée :", "mFineOrig": "Originé ce trimestre :", "mFine2": "Le communiqué parle d'une sanction historique. Votre trésorier l'a déjà imputée au coût normal de l'activité, ce qui est exactement sa place.", "mRugTitle": "Liquidité de sortie", "mRug1": "Vous vendez l'intégralité de l'allocation fondateur sur ce qu'il reste d'offres à l'achat, vous videz la réserve et vous laissez le portefeuille de soutien s'éteindre. On ne dit rien au responsable de la communauté, afin que ses messages rassurants restent sincères.", "mRugRealised": "Réalisé :", "mRug2": "{n} s'arrête ici. Agitation civile +18 — un très grand nombre de gens en détenaient. Attention réglementaire +30.", "mRug3": "La génération {g} coûtera plus cher à lancer. On y croira quand même.", "mWarTitle": "{n} a cédé", "mWarSpoils": "Butin : {n} d'influence restituée. Aucune des parties en présence ne qualifiera cela de défaite, et au sens qui compte, elles ont raison.", "mRefTitle": "Réémettre l'unité de compte ?", "mRef1": "Cette fois, vous n'effondrez pas l'institution. Vous effondrez la monnaie.", "mRef2": "Chaque contrat est redénominé du jour au lendemain à un taux que vous fixez, dans une monnaie que vous émettez, et la différence n'est volée à personne en particulier — elle est simplement la différence.", "mRefSeign": "Seigneuriage réclamé :", "mRefErased": "Effacés : la dette, chaque opération, chaque doctrine, la Pyramide, le jeton, chaque conflit gagné et vos Actifs saisis", "mRefKeep": " (vous en conservez {n})", "mRefErased2": "Chaque système se referme et devra être rouvert.", "mRef3": "La Charte subsiste. La Charte est la partie qui dit ce qu'est la monnaie.", "mRevoltTitle": "La rue s'en est aperçue", "mRevolt1": "L'agitation a atteint 100 %. Les vitrines sont brisées, et quelqu'un a imprimé votre visage sur une pancarte, dans une ressemblance peu aimable mais fidèle.", "mRevolt2": "Revenu ramené à {p} % pendant deux trimestres. L'agitation retombe à 58 %.", "mRevolt3": "La prochaine fois, récoltez la colère vous-même — déclenchez la crise avant qu'elle ne vous déclenche.", "mDosTitle": "Dossier clos — {n}", "mDosAcquired": "Actifs saisis acquis : {n}", "mDos2": "Dépensez-les dans La Pyramide. Rien de ce que vous y bâtissez ne peut être emporté par un effondrement.", "mCrisisTitle": "Déclencher une crise ?", "mCrisis1": "Vous retirez la liquidité, vous exigez le remboursement des prêts et vous laissez le montage s'écrouler dans une direction choisie bien à l'avance.", "mCrisisSeized": "Saisis à l'effondrement :", "mCrisisRecap": "Recapitalisation : vous repartez avec {m}. On ne laisse jamais l'institution faire réellement faillite.", "mCrisisEquity": "Vos actions sont détenues à l'étranger et survivent. Pas les cours : les actifs tangibles s'envoleront, tout le reste chutera.", "mCrisisBest": "Les Actifs sont versés sur votre meilleur cycle, et non à chaque effondrement — le prochain devra aller plus loin que celui-ci pour rapporter à nouveau.", "mCrisisWipes1": "Efface : la dette, chaque opération", "mCrisisRetain": " (vous en conservez 10 %)", "mCrisisWipes2": ", chaque doctrine, votre taux et votre agitation. La Pyramide et vos dossiers subsistent.", "mExportTitle": "Exporter le registre", "mExport1": "Copiez ceci. C'est le seul exemplaire, et il n'en existe aucun autre.", "mImportTitle": "Importer un registre", "mImport1": "Collez une chaîne de registre. La progression actuelle est écrasée sans cérémonie.", "phPaste": "collez ici", "mUnreadTitle": "Illisible", "mUnread1": "Ce registre ne peut pas être lu. Peut-être falsifié. Peut-être par vous.", "mLockTitle": "Le registre refuse de s'ouvrir", "mLock1": "Une sauvegarde existe dans ce navigateur mais ne peut pas être lue. Plutôt que de commencer une nouvelle partie par-dessus, la sauvegarde automatique a été suspendue afin que rien ne soit écrasé.", "mLock2": "Utilisez <b>Importer</b> si vous disposez d'un registre exporté. Utilisez <b>Effacer</b> pour jeter celui qui est endommagé et repartir de zéro — cela réactive la sauvegarde.", "mOffTitle": "Le bureau n'est pas resté vide", "mOff1": "Votre absence a duré {t}. Personne n'a cessé d'originer. Personne n'y a été invité.", "mOff2": "{m} ajoutés à l'encours", "mOff3": "(l'absence est créditée à {p} %", "mOffCap": ", plafonnée à {h} heures", "mWipeTitle": "Dissoudre l'institution ?", "mWipe1": "Cela efface votre sauvegarde dans ce navigateur : la Pyramide, chaque dossier, chaque Actif saisi. Il n'y a ni récupération, ni recours.", "btnProceed": "Poursuivre", "btnRegrettable": "Regrettable", "btnNotYet": "Pas encore", "btnPullIt": "Tout retirer", "btnNext": "Suite", "btnReissue": "Tout réémettre", "btnDeny": "Tout nier", "btnFile": "Classer", "btnLetFall": "Laisser filer", "btnClose": "Fermer", "btnCancel": "Annuler", "btnRestore": "Restaurer", "btnUnderstood": "Entendu", "btnNaturally": "Naturellement", "btn s les vôtres. Surtout les vôtres.", "epiPerp": "Le rendre permanent", "epiPerpDs": "Ne le transmettre à personne. Vous convertir en une procédure à laquelle on ne peut ni objecter, ni intenter de poursuites, ni survivre.", "epiDecline": "Refuser de conclure", "epiDeclineDs": "Ne rien trancher. Continuer à jouer. Il y a toujours un trimestre de plus.", "epiMoral": "Note finale", "epiRemain": "Rester", "epiContinue": "Continuer", "epiAgain": "Recommencer", "epiNote": "Rester conserve votre empire exactement en l'état. Recommencer efface la sauvegarde de ce navigateur et vous ramène au premier jour.", "mRefStop": "."});
Object.assign(TR.es.ui,{"dReaff": "Las doctrinas han sido reafirmadas — reafirmación n.º {n}.", "dHaven": "Montaje fiscal en vigor — {h}. Tipo efectivo ahora del {p}%.", "dUnlocked": "DESBLOQUEADO — {n}.", "dDivs": "Dividendos percibidos {g}, impuesto retenido {t} ({p}%), netos {n}.", "dFine": "Expediente sancionador resuelto por acuerdo — multa {f}. Ingresos trimestrales {q}. Efecto neto sobre la estrategia: ninguno.", "dTokLaunch": "Generación {g} del token lanzada — {n}. Asignación de fundador: 80%.", "dStakeOn": "Programa de staking abierto. El rendimiento se paga con la reserva y con el siguiente depositante.", "dStakeOff": "Programa de staking suspendido a la espera de una revisión a cargo de nosotros mismos.", "dRug": "RETIRADA DE LIQUIDEZ — {n} se ha hundido. {m} realizados. El foro hace preguntas.", "dStakeMissed": "Rendimiento de staking impagado — la reserva está vacía. Los reintegros quedan suspendidos para su protección.", "dTokZero": "{n} ha llegado a cero por sí solo. No fue necesaria ninguna intervención.", "dWarWon": "Conflicto resuelto — {n} ha caído. {r}.", "dCharter": "Carta ampliada — {n}.", "dDenom": "Una nueva denominación entra en circulación.", "dReform": "REFORMA MONETARIA — comienza la era {e}. {y} de señoreaje reclamado.", "dBulkDoc1": "{n} doctrina promulgada en una sola sesión.", "dBulkDocN": "{n} doctrinas promulgadas en una sola sesión.", "dCap": "{n} — nivel {l}.", "dNode": "Pirámide ampliada — {n}.", "dRate": "Reunión de política monetaria concluida — tasa fijada en el {r}%.", "dQuarter": "Originado {m} · agitación {u}% · tasa {r}%.", "dRevolt": "REVUELTA — ingresos reducidos al {p}% durante dos trimestres.", "dOrder": "Orden restablecido. No se nombró a nadie.", "dDosOpen": "Expediente abierto — {n}.", "dDosClose": "Expediente cerrado — {n} · +{a} Activos.", "dCrisis": "CRISIS PROVOCADA — {a} Activos incautados. Recapitalización con {m}.", "dEpilogue": "EPÍLOGO — {n}.", "dRefound": "Institución refundada. Regulador informado. Regulador impasible.", "dHealed1": "{n} valor corrupto reparado antes de guardar.", "dHealedN": "{n} valores corruptos reparados antes de guardar.", "dBackup": "El registro actual estaba dañado; se ha restaurado el anterior.", "dOffline": "Sin vigilancia durante {t} — {m} originados en su ausencia.", "hShort": "h", "mShort": "m", "hoursWord": "horas", "minutesWord": "minutos", "mCatchTitle": "Puesta al día", "mCatch1": "Su posición ya cumple varias etapas de la cadena, así que se han abierto todas a la vez:", "mCatch2": "A partir de aquí se abren de una en una, cada una desde un hito de la anterior.", "mOpenTitle": "Apertura — {n}", "mOpen1": "Su trabajo en {f} lo ha abierto.", "mOpen2": "Ha aparecido una pestaña nueva. Aquí nada se ofrece antes de poder usarse, y nada de lo que se abre vuelve a cerrarse — hasta que usted reemita la moneda, momento en el cual se cierra todo a la vez.", "mFineTitle": "Se ha alcanzado un acuerdo", "mFine1": "La autoridad ha detectado un posicionamiento irregular por delante de sus propios anuncios de tasas. Ha impuesto una multa, no ha obtenido admisión alguna de infracción y no ha nombrado a nadie.", "mFinePaid": "Multa pagada:", "mFineOrig": "Originado este trimestre:", "mFine2": "La nota de prensa la califica de sanción histórica. Su tesorero ya la ha contabilizado como coste de hacer negocios, que es donde le corresponde estar.", "mRugTitle": "Liquidez de salida", "mRug1": "Usted vende la asignación de fundador entera contra las pujas que queden, vacía la reserva y deja que la cartera de apoyo se quede en silencio. Al responsable de comunidad no se le cuenta nada, para que sus mensajes tranquilizadores sigan siendo sinceros.", "mRugRealised": "Realizado:", "mRug2": "{n} termina aquí. Agitación civil +18 — muchísima gente tenía esto en cartera. Atención regulatoria +30.", "mRug3": "La generación {g} costará más de lanzar. También se la creerán.", "mWarTitle": "{n} ha caído", "mWarSpoils": "Botín: {n} de influencia devuelta. Nadie de los implicados describirá lo ocurrido como una derrota y, en el sentido que importa, tienen razón.", "mRefTitle": "¿Reemitir la unidad de cuenta?", "mRef1": "Esta vez no hunde usted la institución. Hunde el dinero.", "mRef2": "Todos los contratos se redenominan de un día para otro a un tipo que fija usted, en una moneda que emite usted, y la diferencia no se le roba a nadie en particular: es sencillamente la diferencia.", "mRefSeign": "Señoreaje reclamado:", "mRefErased": "Se borra: la deuda, todas las operaciones, todas las doctrinas, la Pirámide, el token, cada conflicto ganado y sus Activos incautados", "mRefKeep": " (conserva usted {n})", "mRefErased2": "Se cierran todos los capítulos y hay que volver a abrirlos.", "mRef3": "La Carta sobrevive. La Carta es la parte que dice qué es el dinero.", "mRevoltTitle": "La calle se ha dado cuenta", "mRevolt1": "La agitación ha alcanzado el 100%. No queda un cristal en pie y alguien ha impreso su cara en una pancarta, con un parecido poco amable pero exacto.", "mRevolt2": "Ingresos reducidos al {p}% durante dos trimestres. La agitación baja al 58%.", "mRevolt3": "La próxima vez, coseche usted mismo la ira — provoque la crisis antes de que la crisis le provoque a usted.", "mDosTitle": "Expediente cerrado — {n}", "mDosAcquired": "Activos incautados obtenidos: {n}", "mDos2": "Gástelos en La Pirámide. Nada de lo que construya allí puede llevárselo un colapso.", "mCrisisTitle": "¿Provocar una crisis?", "mCrisis1": "Usted retira la liquidez, exige el vencimiento anticipado de los préstamos y deja que el montaje se venga abajo en una dirección elegida con mucha antelación.", "mCrisisSeized": "Incautado en el colapso:", "mCrisisRecap": "Recapitalización: usted vuelve a empezar con {m}. Nunca se permite que la institución quiebre de verdad.", "mCrisisEquity": "Sus acciones se custodian en el extranjero y sobreviven. Las cotizaciones no: los activos tangibles se dispararán y todo lo demás caerá.", "mCrisisBest": "Los Activos se pagan sobre su mejor ciclo, no por colapso — el próximo tendrá que ir más hondo que este para volver a pagar.", "mCrisisWipes1": "Se borra: la deuda, todas las operaciones", "mCrisisRetain": " (conserva usted el 10%)", "mCrisisWipes2": ", todas las doctrinas, su tasa y su agitación. La Pirámide y sus expedientes sobreviven.", "mExportTitle": "Exportar el registro", "mExport1": "Copie esto. Es el único registro, y no hay ningún otro registro.", "mImportTitle": "Importar un registro", "mImport1": "Pegue una cadena de registro. El progreso actual se sobrescribe sin ceremonia alguna.", "phPaste": "pegar aquí", "mUnreadTitle": "Ilegible", "mUnread1": "Ese registro no se puede interpretar. Posiblemente falsificado. Posiblemente por usted.", "mLockTitle": "El registro no se abre", "mLock1": "Existe una partida guardada en este navegador, pero no se puede leer. En lugar de empezar una partida nueva encima de ella, se ha suspendido el guardado automático para que no se sobrescriba nada.", "mLock2": "Use <b>Importar</b> si dispone de un registro exportado. Use <b>Borrar</b> para descartar el dañado y empezar de nuevo — eso reactiva el guardado.", "mOffTitle": "La mesa no estaba vacía", "mOff1": "Estuvo usted ausente {t}. Nadie dejó de originar. A nadie se le pidió que lo hiciera.", "mOff2": "{m} añadidos al libro", "mOff3": "(la ausencia se abona al {p}%", "mOffCap": ", con un tope de {h} horas", "mWipeTitle": "¿Disolver la institución?", "mWipe1": "Esto borra su partida guardada en este navegador: la Pirámide, todos los expedientes, cada Activo incautado. No hay recuperación posible, y no hay recurso posible.", "btnProceed": "Proceder", "btnRegrettable": "Lamentable", "btnNotYet": "Todavía no", "btnPullIt": "Retirarla", "btnNext": "Siguiente", "btnReissue": "Reemitirlo todo", "btnDeny": "Negarlo todo", "btnFile": "Archivar", "btnLetFall": "Dejarlo caer", "btnClose": "Cerrar", "btnCancel": "Cancelar", "btnRestore": "Restaurar", "btnUnderstood": "Entendido", "btnNaturally": "Naturalm ": "Era", "lEpi": "Epilogo raggiunto", "lPeriod": "Periodo fiscale", "lCycle": "Erogato in questo ciclo", "lAllTime": "Erogato da sempre", "lCrises": "Crisi provocate", "lRevolts": "Rivolte subite", "lAssets": "Beni non spesi / maturati", "lDocs": "Dottrine promulgate", "lNodes": "Nodi della Piramide", "lCaps": "Livelli di vertice", "lDos": "Dossier chiusi", "lOthers": "altri", "lmDocs": "Dottrine", "lmPyr": "Piramide", "lmCaps": "Tranche di vertice", "lmRate": "Tasso di riferimento", "lmCosts": "Costo delle operazioni", "lmClick": "Quota da firma sui ricavi", "lmWorld": "Capitale mondiale detenuto", "lmRealised": "Plusvalenze realizzate", "lmDivs": "Dividendi netti incassati", "lmTax": "Imposta sui dividendi", "lmTok": "Proventi da token (tutte le generazioni)", "lmWar": "Conflitti vinti", "lmWarInc": "Moltiplicatore ricavi da conflitti", "lmCharter": "Moltiplicatore della Carta", "lmSeign": "Signoraggio non speso / rivendicato", "lmCalm": "Freno al malcontento", "lFloored": "(al minimo)", "lRights": "Tutti i diritti riservati.", "lLicence": "Codice consultabile, non open source: leggerlo e giocarci è libero, ridistribuirlo e usarlo a fini commerciali no. La versione ufficiale risiede su hatsukix.github.io/debt-master.", "epiTitle": "Non Resta Più Nulla su Cui Prestare", "epiKicker": "Capitolo VI · Era {e} · {m} erogati nell'arco della vostra vita", "epi1": "Ogni attivo è una garanzia. Ogni flusso di reddito è già ceduto. Ogni trimestre futuro è stato scontato, venduto e scontato di nuovo da chi l'ha comprato.", "epi2": "Il modello riferisce — correttamente, e senza dare l'impressione di accorgersi di ciò che sta dicendo — che l'unica crescita rimasta è nei crediti verso persone che ancora non esistono.", "epi3": "I vostri analisti hanno predisposto tre opzioni. Nessuna delle tre li mette a proprio agio, cosa che hanno espresso predisponendole tutte e tre.", "epiJubilee": "Proclamare il Giubileo", "epiJubileeDs": "Cancellare ogni credito, ovunque, in una sola volta /* JSON turns NaN and Infinity into null, and a null where a number is expected
   makes the whole save unreadable next time. Nothing non-finite gets out. */
function healNumbers(o,depth){
  if(depth>4||o===null||typeof o!=="object") return 0;
  let fixed=0;
  for(const k of Object.keys(o)){
    const v=o[k];
    if(typeof v==="number"){ if(!isFinite(v)){ o[k]=0; fixed++; } }
    else if(v&&typeof v==="object") fixed+=healNumbers(v,depth+1);
  }
  return fixed;
}
let saveBlocked=false;
function saveGame(){
  if(saveBlocked) return false;
  try{
    const fixed=healNumbers(S,0);
    if(fixed) dispatch((fixed>1?U("dHealedN"):U("dHealed1")).replace("{n}",fixed),"evt");
    const blob=Object.assign({},S,{savedAt:Date.now(),ver:2});
    const str=btoa(unescape(encodeURIComponent(JSON.stringify(blob))));
    const prev=localStorage.getItem(SAVE_KEY);
    if(prev) localStorage.setItem(SAVE_KEY+"_bak",prev);   // one generation of undo
    localStorage.setItem(SAVE_KEY,str);
    return true;
  }catch(e){ return false; }
}
function parseSave(raw){
  const o=JSON.parse(decodeURIComponent(escape(atob(raw))));
  if(!Array.isArray(o.gens)) throw new Error("no gens");
  if(typeof o.debt!=="number"||!isFinite(o.debt)) o.debt=0;   // repairable, not fatal
  return o;
}
/* Nested state is replaced wholesale by Object.assign, so any field added to
   tok/war/mkt after a save was written arrives missing and throws on the next
   tick. Heal them against fresh templates instead. */
function healNested(){
  S.tok=Object.assign(freshToken(),S.tok||{});
  S.war=Object.assign(freshWar(),S.war||{});
  S.mkt=Object.assign(freshMarket(),S.mkt||{});
  for(const o of ["px","pos","cost","hist"]) if(!S.mkt[o]) S.mkt[o]={};
  for(const x of SECTORS){
    if(typeof S.mkt.px[x.id]!=="number"||!isFinite(S.mkt.px[x.id])) S.mkt.px[x.id]=100;
    if(typeof S.mkt.pos[x.id]!=="number"||!isFinite(S.mkt.pos[x.id])) S.mkt.pos[x.id]=0;
    if(typeof S.mkt.cost[x.id]!=="number"||!isFinite(S.mkt.cost[x.id])) S.mkt.cost[x.id]=0;
    if(!Array.isArray(S.mkt.hist[x.id])||!S.mkt.hist[x.id].length) S.mkt.hist[x.id]=[S.mkt.px[x.id]];
  }
  if(!Array.isArray(S.tok.hist)) S.tok.hist=[S.tok.px||0];
  if(!S.mkt.havens) S.mkt.havens={};
  if(!S.war.applied) S.war.applied={};
  if(!S.war.won) S.war.won={};
  if(!S.war.touched) S.war.touched={};
  if(!S.unlocked) S.unlocked={ops:true};
  if(!S.charter) S.charter={};
  healNumbers(S,0);
}
function loadGame(){
  let raw=null,bak=null;
  try{ raw=localStorage.getItem(SAVE_KEY); bak=localStorage.getItem(SAVE_KEY+"_bak"); }catch(e){ return false; }
  if(!raw&&!bak) return false;
  let o=null, usedBackup=false;
  try{ o=parseSave(raw); }
  catch(e){
    try{ o=parseSave(bak); usedBackup=true; }
    catch(e2){
      /* Both unreadable. Do NOT start a fresh game on top of them — the autosave
         would erase whatever is still recoverable ten seconds later. */
      saveBlocked=true;
      setTimeout(()=>showModal(U("mLockTitle"),
        "<p>"+U("mLock1")+"</p>"+
        "<p style='color:#8a8199'>"+U("mLock2")+"</p>",
        [{t:U("btnUnderstood"),f:closeModal}]),700);
      return false;
    }
  }
  const savedAt=o.savedAt; delete o.savedAt; delete o.ver;
  S=Object.assign(freshGame(),o);
  while(S.gens.length<GENS.length) S.gens.push(0);
  S.revoltEnd=-1;
  healNested();
  if(usedBackup) dispatch(U("dBackup"),"evt");
  if(savedAt) creditOffline((Date.now()-savedAt)/1000);
  return true;
}
function creditOffline(sec){
  if(!(sec>60)) return;
  const dt=Math.min(sec,OFFLINE_CAP);
  const earned=income()*dt*OFFLINE_RATE;
  if(earned<=0) return;
  gain(earned);
  S.t+=dt;
  // advance the calendar silently — no need for 300 dispatch lines
  const qs=Math.floor((S.qAcc+dt)/QSEC); S.q+=qs; S.qAcc=(S.qAcc+dt)%QSEC;
  if(S.ratePending!==null&&qs>0){ S.rate=S.ratePending; S.ratePending=null; }
  // never let an absence detonate straight into a revolt
  S.unrest=Math.max(0,Math.min(80,S.unrest+unrestPerSec()*dt));
  const h=Math.floor(dt/3600), m=Math.round(dt%3600/60);
  dispatch(U("dOffline").replace("{t}",(h?h+U("hShort")+" ":"")+m+U("mShort")).replace("{m}",money(earned)),"win");
  pendingOffline={txt:(h?h+" "+U("hoursWord")+" ":"")+m+" "+U("minutesWord"), earned:earned, capped:sec>OFFLINE_CAP};
}
let pendingOffline=null;
function showOffline(){
  if(!pendingOffline) return;
  const o=pendingOffline; pendingOffline=null;
  showModal(U("mOffTitle"),
    "<p>"+U("mOff1").replace("{t}",o.txt)+"</p>"+
    "<p style='color:#ffe58a'>"+U("mOff2").replace("{m}",money(o.earned))+
    " <span style='color:#8a8199'>"+U("mOff3").replace("{p}",Math.round(OFFLINE_RATE*100))+
    (o.capped?U("mOffCap").replace("{h}",(OFFLINE_CAP/3600)):"")+")</span></p>",
    [{t:U("btnNaturally"),f:closeModal}]);
}
function wipeSave(){
  showModal(U("mWipeTitle"),
    "<p>"+U("mWipe1")+"</p>",
    [{t:U("btnCancel"),f:closeModal},{t:U("btnDissolve"),f:()=>{
      try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY+"_bak"); }catch(e){}
      saveBlocked=false;
      S=freshGame(); $("#ir").max=maxRate(); $("#ir").value=0;
      dispatch(U("dRefound"),"");
      closeModal(); dirty();
    }}]);
}
setInterval(saveGame,10000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) saveGame(); });
window.addEventListener("beforeunload",saveGame);
window.addEventListener("pagehide",saveGame);

/* ---------- main loop (interval-based so it survives a hidden tab) ---------- */
let lastT=performance.now();
function tick(){
  const now=performance.now();
  let dt=(now-lastT)/1000; lastT=now;
  if(dt>60) dt=60;                      // cap absurd jumps
  S.t+=dt;
  gain(income()*dt);
  /* Clamp the per-tick swing. A backgrounded tab or a stutter used to hand this
     loop a multi-second dt, so unrest could leap from 88% straight past 100 while
     the 160ms repaint still showed 88 — the revolt looked like it fired early. */
  const du=Math.max(-4,Math.min(4,unrestPerSec()*dt));
  S.unrest=Math.max(0,Math.min(100,S.unrest+du));
  if(S.unrest>=100&&!revolting()){
    if(S.brink<0){ S.brink=S.t+BRINK; dispatch("The meter is at 100%. Final warning.","evt"); }
    else if(S.t>=S.brink){ S.brink=-1; triggerRevolt(); }
  } else if(S.unrest<100) S.brink=-1;
  if(S.revoltEnd>0&&S.t>=S.revoltEnd) endRevolt();
  S.qAcc+=dt;
  while(S.qAcc>=QSEC){ S.qAcc-=QSEC; endQuarter(); }
  checkDossiers();
}
setInterval(tick,100);
setInterval(paint,160);

/* ---------- wiring ---------- */
$("#sign").addEventListener("click",doClick);
$("#ir").addEventListener("input",e=>{
  const v=+e.target.value;
  if(noLag()){ S.rate=v; S.ratePending=null; } else S.ratePending=v;
  paint();
});
$("#crisis").addEventListener("click",doCrisis);
$("#btnSave").addEventListener("click",exportSave);
$("#btnLoad").addEventListener("click",importSave);
$("#btnWipe").addEventListener("click",wipeSave);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  const st=CHAIN.find(c=>c.tab===t.dataset.p);
  const keepRef=st&&st.id==="ref"&&(S.reforms>0||S.seignEarned>0);
  if(st&&!stageOpen(st.id)&&!keepRef) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); $("#p"+t.dataset.p).classList.add("on");
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!$("#modal").classList.contains("on")){ e.preventDefault(); doClick(); }
});

/* ticker: duration derived from text width so it stays readable */
(function(){
  const el=$("#tick");
  if(!el.textContent) el.textContent=HEADLINES.slice().sort(()=>Math.random()-.5).join("   ✦   ")+"   ✦   ";
  requestAnimationFrame(()=>{
    const w=el.scrollWidth||4000;
    el.style.animationDuration=Math.round(w/58)+"s";   // ~58 px/sec
  });
})();

/* ---------- boot ---------- */
snapshotEnglish();
loadLang();
applyLang();
buildIntro();
buildLangPicker();
const returning=loadGame();
$("#ir").max=maxRate();
$("#ir").value=(S.ratePending!==null?S.ratePending:S.rate);
if(!returning) dispatch(U("dFounded"),"");
if(returning) $("#intro").classList.add("gone");

setTimeout(showOffline,700);
dirty();
</script>
</body>
