<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Master — a satirical incremental game</title>
<meta name="description" content="You are the banker. You create debt like other people grow tomatoes. An occult incremental game about interest rates, useless insurance and crises you schedule yourself.">
<meta property="og:title" content="Debt Master">
<meta property="og:description" content="You are the banker who pulls the strings. Create debt, sell useless insurance, raise rates at the worst possible moment.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 104'%3E%3Cpath d='M60 6 L114 98 L6 98 Z' fill='%2307060a' stroke='%23d4af37' stroke-width='6'/%3E%3Ccircle cx='60' cy='74' r='16' fill='%237a1420' stroke='%23ffe58a' stroke-width='5'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#07060a; --panel:#14111c;
    --gold:#d4af37; --gold-dim:#8c7423; --gold-hot:#ffe58a;
    --blood:#8c1626; --blood-hot:#d92d43;
    --parch:#e6dcc3; --muted:#8a8199; --green:#4fd18b; --ice:#7fb2d9;
    --edge:rgba(212,175,55,.25);
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ink);color:var(--parch);font-family:var(--serif);overflow:hidden}

  /* ---- ambient ---- */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #bg .glow{position:absolute;left:50%;top:34%;width:1200px;height:1200px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(212,175,55,.10) 0%,rgba(140,22,38,.06) 32%,transparent 62%)}
  #bg .rays{position:absolute;left:50%;top:34%;width:1600px;height:1600px;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,rgba(212,175,55,.05) 0deg 3deg,transparent 3deg 12deg);
    animation:spin 320s linear infinite;opacity:.7;
    -webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #bg .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 4px);opacity:.5}
  #bg .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(0,0,0,.85) 100%)}

  /* ---- shell ---- */
  #shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  header{border-bottom:1px solid var(--edge);background:linear-gradient(180deg,rgba(20,17,28,.95),rgba(10,8,14,.8));
    padding:6px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-size:15px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
  .brand small{display:block;letter-spacing:.16em;font-size:9px;color:var(--muted);margin-top:1px}
  #qclock{min-width:132px;border-left:1px solid var(--edge);padding-left:14px}
  #qclock .q{font-family:var(--mono);font-size:12px;color:var(--gold-hot);letter-spacing:.08em}
  #qclock .bar{height:3px;background:#0b0910;border:1px solid rgba(212,175,55,.2);margin-top:4px;overflow:hidden}
  #qclock .bar i{display:block;height:100%;background:var(--gold-dim)}
  .ticker{flex:1;min-width:180px;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:11px;
    color:var(--blood-hot);border-left:1px solid var(--edge);border-right:1px solid var(--edge);padding:5px 0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 94%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 4%,#000 94%,transparent)}
  .ticker span{display:inline-block;padding-left:100%;animation:slide 150s linear infinite}
  @keyframes slide{to{transform:translateX(-100%)}}
  .hbtn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:transparent;
    color:var(--muted);border:1px solid var(--edge);padding:5px 9px;cursor:pointer;border-radius:2px}
  .hbtn:hover{color:var(--gold);border-color:var(--gold-dim)}

  main{flex:1;display:grid;grid-template-columns:minmax(320px,368px) 1fr;min-height:0}

  /* ---- altar ---- */
  #altar{border-right:1px solid var(--edge);padding:12px 15px 18px;display:flex;flex-direction:column;gap:11px;
    overflow-y:auto;background:linear-gradient(180deg,rgba(15,13,21,.6),rgba(7,6,10,.9))}
  #eyewrap{display:flex;justify-content:center}
  #eye{width:104px;height:90px;filter:drop-shadow(0 0 12px rgba(212,175,55,.4))}
  #eye .pupil{transform-origin:center;animation:blink 13s ease-in-out infinite}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}

  .counter{text-align:center}
  .counter .big{font-family:var(--mono);font-size:31px;color:var(--gold-hot);line-height:1.1;text-shadow:0 0 18px rgba(212,175,55,.32)}
  .counter .lbl{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .counter .rate{font-family:var(--mono);font-size:11px;color:var(--green);margin-top:5px}
  .counter .rate b{color:var(--muted);font-weight:400}

  #sign{position:relative;width:100%;padding:13px 10px;cursor:pointer;user-select:none;
    background:linear-gradient(180deg,#241a10,#140d09);border:1px solid var(--gold-dim);border-radius:3px;
    color:var(--gold-hot);font-family:var(--serif);font-size:14px;letter-spacing:.22em;text-transform:uppercase;
    transition:transform .06s,box-shadow .18s;box-shadow:inset 0 0 26px rgba(212,175,55,.06)}
  #sign:hover{box-shadow:0 0 20px rgba(212,175,55,.16),inset 0 0 26px rgba(212,175,55,.12)}
  #sign:active{transform:scale(.985)}
  #sign small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:none;margin-top:3px}
  #floats{position:fixed;inset:0;pointer-events:none;z-index:50}
  .float{position:absolute;font-family:var(--mono);font-size:12px;color:var(--gold-hot);text-shadow:0 0 8px rgba(212,175,55,.6);
    animation:rise 1.1s ease-out forwards}
  @keyframes rise{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-48px)}}

  .box{border:1px solid var(--edge);background:rgba(20,17,28,.55);border-radius:3px;padding:9px 11px}
  .box h3{margin:0 0 7px;font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:400;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .box h3 em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--parch)}
  input[type=range]{width:100%;accent-color:var(--blood-hot);cursor:pointer}
  .hint{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.55}
  .pend{color:var(--ice)}

  .meter{height:9px;border:1px solid var(--edge);background:#0b0910;border-radius:2px;overflow:hidden}
  .meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4a7f5e,#c9a227 55%,var(--blood-hot));transition:width .3s}
  .meter.hot{animation:pulseRed 1.1s ease-in-out infinite}
  @keyframes pulseRed{50%{box-shadow:0 0 12px rgba(217,45,67,.65)}}

  .crisisbtn{width:100%;margin-top:8px;padding:9px;cursor:pointer;border-radius:2px;
    background:linear-gradient(180deg,#3a0d16,#1a060b);border:1px solid #5e1420;color:#e79aa6;
    font-family:var(--serif);letter-spacing:.18em;text-transform:uppercase;font-size:11.5px}
  .crisisbtn:enabled:hover{border-color:var(--blood-hot);color:#fff;box-shadow:0 0 18px rgba(217,45,67,.26)}
  .crisisbtn:disabled{opacity:.32;cursor:not-allowed}

  /* ---- panels ---- */
  #right{display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--edge);background:rgba(10,8,14,.6)}
  .tab{flex:1;padding:10px 4px;text-align:center;cursor:pointer;font-size:9.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);border-right:1px solid var(--edge);white-space:nowrap}
  .tab:last-child{border-right:0}
  .tab.on{color:var(--gold);background:rgba(212,175,55,.06);box-shadow:inset 0 -2px 0 var(--gold-dim)}
  .tab.off{opacity:.3;cursor:not-allowed}
  .tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-left:5px;
    vertical-align:middle;animation:pulseDot 1.8s infinite}
  @keyframes pulseDot{50%{opacity:.25}}
  .pane{flex:1;overflow-y:auto;padding:12px 14px 44px;display:none}
  .pane.on{display:block}

  .paneHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sect{font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim);
    border-bottom:1px solid var(--edge);padding-bottom:5px;flex:1;min-width:140px}
  .mults{display:flex;gap:4px}
  .mult{font-family:var(--mono);font-size:10px;padding:4px 9px;border:1px solid var(--edge);color:var(--muted);
    cursor:pointer;border-radius:2px;background:transparent}
  .mult.on{color:var(--gold-hot);border-color:var(--gold-dim);background:rgba(212,175,55,.1)}

  .item{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;
    border:1px solid rgba(212,175,55,.14);background:rgba(20,17,28,.5);padding:8px 11px;border-radius:3px;
    margin-bottom:6px;cursor:pointer;transition:.14s}
  .item:hover{border-color:var(--gold-dim);background:rgba(31,26,42,.7)}
  .item.locked{opacity:.34;cursor:not-allowed;filter:grayscale(.6)}
  .item.owned{border-color:rgba(79,209,139,.32);background:rgba(20,40,30,.32);cursor:default}
  .sig{font-size:17px;text-align:center;line-height:1;color:var(--gold);filter:drop-shadow(0 0 6px rgba(212,175,55,.35))}
  .nm{font-size:13.5px;color:var(--parch)}
  .ds{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.55}
  .rt{font-family:var(--mono);font-size:9.5px;color:var(--green);margin-top:2px}
  .buy{text-align:right;white-space:nowrap}
  .buy .cost{font-family:var(--mono);font-size:12.5px;color:var(--gold-hot)}
  .buy .cost.no{color:#6b5f4a}
  .buy .cnt{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}

  /* ---- dossiers ---- */
  .dos{border:1px solid rgba(212,175,55,.16);background:rgba(20,17,28,.55);border-radius:3px;padding:11px 13px;margin-bottom:9px}
  .dos.act{border-color:rgba(127,178,217,.4);background:rgba(16,24,34,.55)}
  .dos.done{border-color:rgba(79,209,139,.3);background:rgba(18,34,26,.35);opacity:.75}
  .dos .code{font-family:var(--mono);font-size:9px;color:var(--gold-dim);letter-spacing:.18em}
  .dos .ti{font-size:15px;color:var(--gold-hot);margin:2px 0 6px}
  .dos .bd{font-family:var(--mono);font-size:10.5px;color:var(--parch);line-height:1.75;opacity:.9}
  .dos .goal{font-family:var(--mono);font-size:10px;color:var(--ice);margin-top:8px}
  .dos .rew{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:3px}
  .dos .foot{display:flex;gap:8px;align-items:center;margin-top:9px}
  .pbar{flex:1;height:6px;background:#0b0910;border:1px solid var(--edge);overflow:hidden;border-radius:2px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#3d6a86,var(--ice))}
  .dbtn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;
    border:1px solid var(--gold-dim);background:rgba(212,175,55,.08);color:var(--gold-hot);cursor:pointer;border-radius:2px}
  .dbtn:disabled{opacity:.3;cursor:not-allowed}
  .dbtn.claim{border-color:var(--green);color:var(--green);background:rgba(79,209,139,.1);animation:pulseDot 1.4s infinite}

  /* ---- tree ---- */
  #treeWrap{position:relative;margin-top:6px}
  .treeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;position:relative;z-index:2}
  .branchHead{font-size:10px;letter-spacing:.24em;text-transform:uppercase;text-align:center;padding-bottom:7px;
    border-bottom:1px solid var(--edge);color:var(--gold)}
  .node{border:1px solid rgba(212,175,55,.18);background:rgba(16,13,22,.9);border-radius:3px;padding:8px 10px;
    cursor:pointer;transition:.15s;position:relative}
  .node:hover{border-color:var(--gold-dim)}
  .node .nn{font-size:12.5px;color:var(--parch);line-height:1.3}
  .node .nd{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:4px;line-height:1.5}
  .node .nc{font-family:var(--mono);font-size:10.5px;color:var(--gold-hot);margin-top:5px}
  .node.have{border-color:rgba(79,209,139,.45);background:rgba(18,34,26,.6)}
  .node.have .nc{color:var(--green)}
  .node.lock{opacity:.4;cursor:not-allowed}
  .node.can{box-shadow:0 0 14px rgba(212,175,55,.16);border-color:var(--gold)}
  .link{height:12px;display:flex;justify-content:center}
  .link i{width:1px;background:rgba(212,175,55,.3);display:block}
  .link.on i{background:var(--green);width:2px}

  .stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:5px 0;
    border-bottom:1px dotted rgba(212,175,55,.13)}
  .stat b{color:var(--gold-hot);font-weight:400}
  .empty{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:22px 4px;text-align:center;line-height:1.9}
  .disp{font-family:var(--mono);font-size:10px;color:var(--muted);padding:4px 0;border-bottom:1px dotted rgba(212,175,55,.1);line-height:1.6}
  .disp b{color:var(--gold-dim);font-weight:400}
  .disp.evt{color:#e79aa6}
  .disp.win{color:var(--green)}

  /* ---- modal ---- */
  #modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(2,1,4,.87);padding:16px}
  #modal.on{display:flex}
  .card{width:min(580px,94vw);max-height:88vh;overflow-y:auto;border:1px solid var(--gold-dim);
    background:linear-gradient(180deg,#181320,#0c0912);padding:20px 22px;border-radius:4px;box-shadow:0 0 60px rgba(212,175,55,.12)}
  .card h2{margin:0 0 10px;color:var(--gold);font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:14px}
  .card p{font-family:var(--mono);font-size:11.5px;color:var(--parch);line-height:1.8}
  .card textarea{width:100%;height:104px;background:#07060a;border:1px solid var(--edge);color:var(--green);
    font-family:var(--mono);font-size:9.5px;padding:8px;border-radius:2px;resize:none}
  .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
  #flash{position:fixed;inset:0;z-index:60;pointer-events:none;background:radial-gradient(circle,rgba(217,45,67,.3),transparent 70%);opacity:0;transition:opacity .6s}
  #flash.on{opacity:1}

  /* ---- trading floor ---- */
  .mkt{border:1px solid rgba(212,175,55,.16);background:rgba(20,17,28,.5);border-radius:3px;
    padding:10px 12px;margin-bottom:7px;display:grid;grid-template-columns:26px 1fr 92px auto;gap:11px;align-items:center}
  .mkt.held{border-color:rgba(127,178,217,.38);background:rgba(16,24,34,.5)}
  .mkt .px{font-family:var(--mono);font-size:13px;color:var(--gold-hot);text-align:right}
  .mkt .chg{font-family:var(--mono);font-size:10px;text-align:right;margin-top:2px}
  .up{color:var(--green)} .dn{color:var(--blood-hot)} .flat{color:var(--muted)}
  .mkt .pos{font-family:var(--mono);font-size:10px;color:var(--ice);margin-top:3px}
  .spark{display:block;width:92px;height:26px}
  .sbtns{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
  .sbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:4px 8px;border-radius:2px;
    border:1px solid var(--edge);background:transparent;color:var(--muted);cursor:pointer}
  .sbtn:hover:enabled{color:var(--gold-hot);border-color:var(--gold-dim)}
  .sbtn.sell{color:#c98a94}
  .sbtn.sell:hover:enabled{color:#fff;border-color:var(--blood-hot)}
  .sbtn:disabled{opacity:.28;cursor:not-allowed}
  .warn{border:1px solid rgba(217,45,67,.45);background:rgba(58,13,22,.4);border-radius:3px;
    padding:9px 12px;margin-bottom:10px;font-family:var(--mono);font-size:10px;color:#e79aa6;line-height:1.7}
  .chapline{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10.5px;
    padding:7px 0;border-bottom:1px dotted rgba(212,175,55,.13)}
  .chapline.open{color:var(--green)} .chapline.shut{color:var(--muted)}
  .chapline b{font-weight:400;color:var(--parch)}

  /* ---- the token ---- */
  .tokHead{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    border:1px solid var(--edge);background:rgba(20,17,28,.6);border-radius:3px;padding:12px 14px;margin-bottom:10px}
  .tokName{font-size:22px;letter-spacing:.16em;color:var(--gold-hot);text-transform:uppercase}
  .tokName small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--muted);
    text-transform:none;margin-top:3px}
  .tokPx{font-family:var(--mono);font-size:20px;color:var(--gold-hot);text-align:right}
  .gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:10px}
  .gauge{border:1px solid var(--edge);background:rgba(20,17,28,.5);border-radius:3px;padding:8px 10px}
  .gauge b{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--gold-dim);
    text-transform:uppercase;font-weight:400}
  .gauge s{display:block;font-family:var(--mono);font-size:14px;color:var(--parch);text-decoration:none;margin:3px 0 5px}
  .gauge .meter{height:6px}
  .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px;margin-top:10px}
  .act{border:1px solid var(--edge);background:rgba(20,17,28,.55);border-radius:3px;padding:10px 12px;
    cursor:pointer;transition:.14s}
  .act:hover:not(.off){border-color:var(--gold-dim);background:rgba(31,26,42,.75)}
  .act.off{opacity:.32;cursor:not-allowed}
  .act.rug{border-color:#5e1420;background:rgba(58,13,22,.35)}
  .act.rug:hover:not(.off){border-color:var(--blood-hot);box-shadow:0 0 18px rgba(217,45,67,.22)}
  .act .an{font-size:13.5px;color:var(--parch)}
  .act .ad{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.55}
  .act .ac{font-family:var(--mono);font-size:11px;color:var(--gold-hot);margin-top:5px}

  /* ---- conflicts ---- */
  .infBar{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
    border:1px solid var(--edge);background:rgba(20,17,28,.6);border-radius:3px;padding:11px 13px;margin-bottom:11px}
  .infBig{font-family:var(--mono);font-size:20px;color:var(--gold-hot)}
  .war{border:1px solid rgba(212,175,55,.16);background:rgba(20,17,28,.5);border-radius:3px;
    padding:11px 13px;margin-bottom:8px}
  .war.eng{border-color:rgba(217,45,67,.4);background:rgba(40,14,20,.4)}
  .war.won{border-color:rgba(79,209,139,.32);background:rgba(18,34,26,.32);opacity:.8}
  .war.shut{opacity:.32}
  .war .wt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .war .wn{font-size:15px;color:var(--gold-hot)}
  .war .wr{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
  .war .wd{font-family:var(--mono);font-size:10.5px;color:var(--parch);line-height:1.7;opacity:.9;margin-top:5px}
  .war .wc{font-family:var(--mono);font-size:10px;color:#e79aa6;margin-top:6px}
  .war .wg{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:3px}

<script>

/* ==========================================================================
   DEBT MASTER — prototype v0.2
   Single file, no external deps, no browser storage (manual ledger export).
   Design notes:
     · Time is measured in fiscal quarters (QSEC seconds each). Policy-rate
       changes only take effect at the next quarter — the game is meant to be

     · Clicking never scales with income. It bootstraps the first minute only.

   A language is only offered once it defines every id English defines, so a

const LANGS=[
 {id:"en",label:"English"},
 {id:"fr",label:"Français"},
 {id:"es",label:"Español"},
 {id:"de",label:"Deutsch"},
 {id:"pt",label:"Português"},
 {id:"it",label:"Italiano"},
 {id:"zh",label:"中文"},
 {id:"ko",label:"한국어"}
];
const TR={};                       // TR.fr = {ui:{...}, gens:{...}, ...}
let LANG="en";
/* Resolves a dotted id against the active language, falling back to the English
   passed at the call site. Never returns undefined. */
function T(path,fallback){
  const L=TR[LANG];
  if(!L) return fallback;
  let v=L;
  for(const k of path.split(".")){ if(v==null) break; v=v[k]; }
  return (v===undefined||v===null||v==="")?fallback:v;
}
/* Every id the English side uses, collected once so completeness can be judged. */
const REQUIRED_IDS=[];
function reg(path){ if(REQUIRED_IDS.indexOf(path)<0) REQUIRED_IDS.push(path); return path; }
function langComplete(id){
  if(id==="en") return true;
  const L=TR[id]; if(!L) return false;
  for(const path of REQUIRED_IDS){
    let v=L;
    for(const k of path.split(".")){ if(v==null) break; v=v[k]; }
    if(v===undefined||v===null||v==="") return false;
  }
  return true;
}
const availableLangs=()=>LANGS.filter(l=>langComplete(l.id));
function langCoverage(id){
  if(id==="en") return 1;
  const L=TR[id]; if(!L) return 0;
  let have=0;
  for(const path of REQUIRED_IDS){
    let v=L; for(const k of path.split(".")){ if(v==null) break; v=v[k]; }
    if(v!==undefined&&v!==null&&v!=="") have++;
  }
  return REQUIRED_IDS.length?have/REQUIRED_IDS.length:0;
}
/* The translatable fields of every content array, and a pristine English copy of
   them taken at boot. Switching language rewrites the arrays in place, so every
   render site keeps working untouched — there is no t() call to forget. */
const TRANSLATABLE=[
 {key:"gens",   arr:()=>GENS,        fields:["name","ds"]},
 {key:"ups",    arr:()=>UPS,         fields:["name","ds"]},
 {key:"dos",    arr:()=>DOSSIERS,    fields:["name","bd","goal","code"]},
 {key:"nodes",  arr:()=>ALLNODES,    fields:["name","nd"]},
 {key:"caps",   arr:()=>CAPS,        fields:["name","nd"]},
 {key:"sectors",arr:()=>SECTORS,     fields:["name","ds"]},
 {key:"havens", arr:()=>HAVENS,      fields:["name","ds"]},
 {key:"targets",arr:()=>TARGETS,     fields:["name","ds","rw"]},
 {key:"charter",arr:()=>CHARTER,     fields:["name","ds"]},
 {key:"chain",  arr:()=>CHAIN,       fields:["name"]}
];
let EN_SNAP=null;
function snapshotEnglish(){
  EN_SNAP={};
  for(const g of TRANSLATABLE){
    EN_SNAP[g.key]={};
    for(const o of g.arr()){
      EN_SNAP[g.key][o.id]={};
      for(const f of g.fields) if(o[f]!==undefined){
        EN_SNAP[g.key][o.id][f]=o[f];
        reg(g.key+"."+o.id+"."+f);
      }
    }
  }
  EN_SNAP.misc={
    tokenNames:TOKEN_NAMES.map(x=>({n:x.n,t:x.t,pitch:x.pitch})),
    headlines:HEADLINES.slice(), coldNames:COLD_NAMES.slice(), coldBodies:COLD_BODIES.slice(),
    denom:{name:DENOM.name,ds:DENOM.ds},
    endings:JSON.parse(JSON.stringify(ENDINGS)), moral:MORAL.slice(), punch:MORAL_PUNCH,
    tierNames:null
  };
  TOKEN_NAMES.forEach((x,i)=>{reg("tokenNames."+i+".n");reg("tokenNames."+i+".pitch");});
  HEADLINES.forEach((x,i)=>reg("headlines."+i));
  COLD_NAMES.forEach((x,i)=>reg("coldNames."+i));
  COLD_BODIES.forEach((x,i)=>reg("coldBodies."+i));
  reg("denom.name"); reg("denom.ds");
  Object.keys(ENDINGS).forEach(k=>{reg("endings."+k+".title");reg("endings."+k+".kicker");
    ENDINGS[k].body.forEach((b,i)=>reg("endings."+k+".body."+i));});
  MORAL.forEach((m,i)=>reg("moral."+i)); reg("punch");
  Object.keys(UI_EN).forEach(k=>reg("ui."+k));
}
function applyLang(){
  if(!EN_SNAP) return;
  const L=TR[LANG]||{};
  for(const g of TRANSLATABLE){
    for(const o of g.arr()){
      const en=EN_SNAP[g.key][o.id]||{}, tr=(L[g.key]||{})[o.id]||{};
      for(const f of g.fields) if(en[f]!==undefined) o[f]=(tr[f]||en[f]);
    }
  }
  const m=EN_SNAP.misc;
  TOKEN_NAMES.forEach((x,i)=>{ const tr=(L.tokenNames||[])[i]||{};
    x.n=tr.n||m.tokenNames[i].n; x.pitch=tr.pitch||m.tokenNames[i].pitch; });
  for(let i=0;i<HEADLINES.length;i++)   HEADLINES[i]=(L.headlines||[])[i]||m.headlines[i];
  for(let i=0;i<COLD_NAMES.length;i++)  COLD_NAMES[i]=(L.coldNames||[])[i]||m.coldNames[i];
  for(let i=0;i<COLD_BODIES.length;i++) COLD_BODIES[i]=(L.coldBodies||[])[i]||m.coldBodies[i];
  DENOM.name=(L.denom||{}).name||m.denom.name;
  DENOM.ds=(L.denom||{}).ds||m.denom.ds;
  for(const k of Object.keys(ENDINGS)){
    const tr=(L.endings||{})[k]||{}, en=m.endings[k];
    ENDINGS[k].title=tr.title||en.title;
    ENDINGS[k].kicker=tr.kicker||en.kicker;
    ENDINGS[k].body=en.body.map((b,i)=>(tr.body||[])[i]||b);
  }
  for(let i=0;i<MORAL.length;i++) MORAL[i]=(L.moral||[])[i]||m.moral[i];
  MORAL_PUNCH=(L.punch)||m.punch;
  const el=document.getElementById("tick");
  if(el){ el.textContent=HEADLINES.slice().sort(()=>Math.random()-.5).join("   ✦   ")+"   ✦   "; }
}
/* One short id per user-visible interface string. English lives here. */
const UI_EN={
  title:"Debt Master",
  subtitle:"Chapter I — The Pyramid Awakens",
  lede:"You are the banker. You create debt the way other people grow tomatoes.<br>"+
    "You sell insurance that covers nothing, you raise rates at the worst possible moment, "+
    "and when the anger becomes unmanageable you <em>schedule the collapse yourself</em> — because "+
    "a crisis you planned is simply a quarter with better margins.",
  r1t:"Originate", r1d:"Buy operations. They run without you. Clicking only bootstraps the first minute.",
  r2t:"Squeeze",   r2d:"A higher policy rate pays more and angers more. Rates take effect next quarter.",
  r3t:"Collapse",  r3d:"Harvest the unrest before it becomes a revolt. Seized Assets build the Pyramid.",
  begin:"Take the Desk",
  footSatire:"Satire. Every conspiracy here is either absurd or a matter of public record.",
  footSave:"Progress saves automatically in this browser.",
  footRights:"All rights reserved",
  tabOps:"Operations", tabDoc:"Doctrines", tabDos:"Dossiers", tabPyr:"The Pyramid",
  tabMkt:"Market", tabTok:"Token", tabWar:"Conflicts", tabRef:"Reform", tabLed:"Ledger",
  sign:"Sign a Loan", perSig:"per signature",
  debtLabel:"Debt Under Management", perSec:"/sec", perQuarter:"/quarter",
  policyRate:"Policy Rate", yield_:"Yield", unrestWord:"unrest",
  pendingAt:"Pending — takes effect at", takesEffect:"Changes take effect at the next quarter.",
  advNotice:"Advance Notice: changes apply immediately.",
  civilUnrest:"Civil Unrest",
  u1:"The public is docile. Raise rates.",
  u2:"Grumbling on the radio. Nothing structural.",
  u3:"Placards, op-eds, an unhelpful number of torches.",
  u4:"Boards on the windows. Consider harvesting this.",

function loadLang(){
  let saved=null;

  /* First visit: offer the browser's language if we have it complete. */
  const nav=(navigator.language||"en").slice(0,2).toLowerCase();
  if(nav!=="en"&&langComplete(nav)){ LANG=nav; document.documentElement.lang=nav; }

const SUF=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","Ud","Dd","Td","Qd",
           "QiD","SxD","SpD","OcD","NoD","Vg","UVg","DVg","TVg"];
function fmt(n){
  if(typeof n!=="number"||Number.isNaN(n)) return "—";   // never dress a broken number as a big one
  if(n===Infinity) return "∞";
  if(n===-Infinity) return "-∞";
  if(n<0) return "-"+fmt(-n);
  if(n<1000) return (n<10&&n%1!==0)?n.toFixed(1):Math.floor(n).toString();
  let t=0;
  while(n>=1000&&t<SUF.length-1){ n/=1000; t++; }
  if(n>=1000) return n.toExponential(2).replace("e+","e")+SUF[SUF.length-1];  // past the table
  return n.toFixed(n<10?2:n<100?1:0)+SUF[t];
}
const money=n=>"§"+fmt(n);

  dispatch(U("dHaven").replace("{h}",h.name).replace("{p}",(taxRate()*100).toFixed(0)),"win");
  dirty();
}

const gscale=n=>Math.max(1,Math.ceil(n*(hasCh("standing")?0.5:1)));

const stageOpen=id=>!!(S.unlocked&&S.unlocked[id]) || id==="ops";
/* Latch: a dip in a counter must never take a tab away again. */
function refreshUnlocks(){
  if(!S.unlocked) S.unlocked={};
  const opened=[];
  for(const c of CHAIN){
    if(S.unlocked[c.id]) continue;
    const prevOpen=!c.from || stageOpen(CHAIN[CHAIN.indexOf(c)-1].id);
    if(prevOpen && stageReady(c.id)){

  opened.forEach(c=>dispatch(U("dUnlocked").replace("{n}",c.name),"win"));

function stageProgress(c){

/* The chapter banner reuses the CHAIN label, which applyLang() already rewrites —
   so the banner follows the language without a second set of translated names. */
/* The name of the link a stage opens from. Held as a back-reference rather than
   a second copy of the label, so translating CHAIN translates this too. */
function chainFrom(c){ const i=CHAIN.findIndex(x=>x.id===c.id); return i>0?CHAIN[i-1].name:null; }
const CH2CHAIN={market:"mkt",token:"tok",conflict:"war",reform:"ref"};
function chapName(c){ const e=CHAIN.find(x=>x.id===CH2CHAIN[c.id]); return e?e.name:c.name; }
const routeTxt=r=>(r.pct()? r.have.toFixed(1)+"% / "+r.need+"%" : fmt(r.have)+" / "+fmt(r.need))+" "+r.label;
const CHAPKEY={market:"mkt",token:"tok",conflict:"war",reform:"ref"};
const chapterOpen=id=>stageOpen(CHAPKEY[id]);
const SUSP_PER_TRADE=9;      // attention earned for trading on a pending decision
const SUSP_DECAY=2.0;        // per quarter

function freshMarket(){
  const m={px:{},pos:{},cost:{},hist:{},susp:0,realised:0,fines:0,divs:0,tax:0,havens:{},scale:0};
  for(const x of SECTORS){ m.px[x.id]=100; m.pos[x.id]=0; m.cost[x.id]=0; m.hist[x.id]=[100]; }
  return m;
}
const mkt=()=>{ if(!S.mkt) S.mkt=freshMarket(); if(!S.mkt.havens) S.mkt.havens={}; return S.mkt; };
/* Ratchets on every read, never falls. It used to be initialised lazily on first
   access — which happened during the boot repaint, when income() is still 0, so
   it stuck at the 1e-6 floor and the whole world cost §500. */
function mktScale(){
  const m=mkt(), want=income()*QSEC*SCALE_K;
  if(!(m.scale>0)||want>m.scale) m.scale=want>0?want:1e-6;
  return m.scale;
}
function ratchetScale(){ mktScale(); }
const shareVal=id=>mkt().px[id]*mktScale();
const heldShares  = id=>mkt().pos[id]||0;
const freeFloat   = id=>Math.max(0,SHARES-heldShares(id));
const ownPct      = id=>heldShares(id)/SHARES;
function worldPct(){
  let held=0; for(const x of SECTORS) held+=heldShares(x.id);
  return held/(SHARES*SECTORS.length);
}
function portfolioValue(){
  let v=0; for(const x of SECTORS) v+=heldShares(x.id)*shareVal(x.id);
  return v;
}
/* Scarcity premium: the last shares cost far more than the first. */
function buyCost(id,pctOfFloat){
  const n=freeFloat(id)*pctOfFloat;
  if(n<=0) return Infinity;
  const scarcity=1+Math.pow(ownPct(id),2)*4;
  return n*shareVal(id)*scarcity;
}
function insiderRisk(){ return S.ratePending!==null && S.ratePending!==S.rate; }

function moveMarket(rateDelta){
  const m=mkt();
  ratchetScale();
  for(const x of SECTORS){
    const policy = x.beta*rateDelta*0.016;
    const anger  = x.unr*(S.unrest/100-0.35)*0.07;
    const noise  = (Math.random()-0.5)*0.09;
    const drift  = 0.006;
    const tight  = ownPct(x.id)*0.03;          // your own buying supports the price
    m.px[x.id]=Math.max(4, m.px[x.id]*(1+policy+anger+noise+drift+tight));
    const h=m.hist[x.id]; h.push(m.px[x.id]); if(h.length>26) h.shift();
  }
  payDividends();
  if(m.susp>=100) investigation();
  else m.susp=Math.max(0,m.susp-SUSP_DECAY*warSuspDecay());
}
/* A sector pays on how it has actually done, not on what it promised. */
function sectorHealth(id){
  const h=mkt().hist[id];
  if(!h||h.length<2) return 1;
  return Math.max(0.25,Math.min(2.2,h[h.length-1]/h[0]));
}
function quarterDividend(id){
  const x=SECTORS.find(y=>y.id===id);
  return heldShares(id)*shareVal(id)*x.div*sectorHealth(id);
}
function payDividends(){
  const m=mkt();
  let gross=0;
  for(const x of SECTORS) gross+=quarterDividend(x.id);
  if(gross<=0) return;
  const t=taxRate(), tax=gross*t, net=gross-tax;
  m.divs+=net; m.tax+=tax;
  S.debt+=net; S.runTotal+=net; S.allTime+=net;
  if(S.runTotal>S.bestRun) S.bestRun=S.runTotal;
  if(S.q%4===0) dispatch(U("dDivs").replace("{g}",money(gross)).replace("{t}",money(tax))
    .replace("{p}",(t*100).toFixed(0)).replace("{n}",money(net)),"");
}
function investigation(){
  const m=mkt();
  const fine=Math.max(1,S.debt*0.12*warFine());
  S.debt-=fine; m.fines+=fine; m.susp=35;
  const q=income()*QSEC;
  dispatch(U("dFine").replace("{f}",money(fine)).replace("{q}",money(q)),"evt");
  showModal(U("mFineTitle"),
    "<p>"+U("mFine1")+"</p>"+
    "<p style='color:#d92d43'>"+U("mFinePaid")+" "+money(fine)+"</p>"+
    "<p style='color:#4fd18b'>"+U("mFineOrig")+" "+money(q)+"</p>"+
    "<p style='color:#8a8199'>"+U("mFine2")+"</p>",
    [{t:U("btnRegrettable"),f:closeModal}]);
}
function buyStock(id,pctOfFloat){
  const m=mkt(), n=freeFloat(id)*pctOfFloat, cost=buyCost(id,pctOfFloat);
  if(n<=0||!isFinite(cost)||S.debt<cost) return;
  m.pos[id]+=n; m.cost[id]+=cost; S.debt-=cost;
  m.px[id]*=1+pctOfFloat*0.20;                 // absorbing the float lifts the price
  if(insiderRisk()) m.susp=Math.min(120,m.susp+SUSP_PER_TRADE);
  dirty();
}
function sellStock(id,pct){
  const m=mkt(), n=heldShares(id)*pct;
  if(n<=0) return;
  const value=n*shareVal(id)*(1-Math.min(0.4,pct*0.35)), basis=m.cost[id]*pct;
  m.pos[id]-=n; m.cost[id]-=basis;
  m.px[id]*=1-pct*0.18;
  S.debt+=value;
  const profit=value-basis;
  m.realised+=profit;
  if(profit>0){ S.runTotal+=profit; S.allTime+=profit; if(S.runTotal>S.bestRun) S.bestRun=S.runTotal; }
  if(insiderRisk()) m.susp=Math.min(120,m.susp+SUSP_PER_TRADE);
  dirty();
}

/* ==========================================================================
   CHAPTER III — THE TOKEN
   You are not trading someone else's asset now, you are issuing your own.
   Supply is a number you choose, hype is a number you buy, and trust is the
   only one you cannot simply purchase. Every generation ends the same way;
   the only decision is when.
   ========================================================================== */
const TOKEN_NAMES=[
 {n:"OBOLUS",  t:"OBL", pitch:"A frictionless settlement layer for the unbanked, who were not consulted."},
 {n:"VERITAS", t:"VRT", pitch:"Truth, notarised on-chain, at four hundred transactions a second."},
 {n:"SOLIDUS", t:"SLD", pitch:"Algorithmically stable. The algorithm is a promise, and promises are code."},
 {n:"AEON",    t:"AEO", pitch:"A store of value for the long term, launched last Tuesday."},
 {n:"PARAGON", t:"PGN", pitch:"Governance is decentralised across the community. We hold the community."},
 {n:"NEXUM",   t:"NXM", pitch:"Backed one-to-one by instruments we also issue. The circle is the innovation."},
 {n:"TRUSTLESS",t:"TRL",pitch:"No trust required, which is fortunate, given the circumstances."}
];
const TOK_SUPPLY=1e6;
const TOK_SAT=22;           // adoption ceiling, in multiples of the launch cap
const TOK_GROWTH=0.55;      /* Swept over saturation x growth: the cap peaks around x49 at q40, but
                               promotion costs scale with the cap, so the best exit is q28 for ~22
                               quarters of income. You sell while it still looks healthy. */
function freshToken(){ return {live:false,gen:0,idx:0,mcap:0,launchMcap:0,px:0,held:0,
  hype:0,trust:0,holders:0,reserve:0,staking:false,raised:0,soldQ:0,hist:[],dead:false}; }
const tok=()=>{ if(!S.tok) S.tok=freshToken(); return S.tok; };
const tokPx=()=>{ const t=tok(); return t.mcap/TOK_SUPPLY; };
const tokPublicPct=()=>1-tok().held/TOK_SUPPLY;
const tokValue=()=>{ const t=tok(); return t.live? (t.held/TOK_SUPPLY)*t.mcap : 0; };
function tokLaunchCost(){ return Math.max(1e4, income()*QSEC*0.8*Math.pow(2.1,tok().gen)); }
function tokPromoCost(){ return Math.max(1e3, tok().mcap*0.020); }
function tokSeedCost(){  return Math.max(1e3, tok().mcap*0.040); }

function launchToken(){
  const t=tok(), cost=tokLaunchCost();
  if(t.live||S.debt<cost) return;
  S.debt-=cost;
  t.live=true; t.dead=false; t.gen++;
  t.idx=(t.gen-1)%TOKEN_NAMES.length;
  t.launchMcap=Math.max(1, income()*QSEC*10);
  t.mcap=t.launchMcap; t.px=tokPx();
  t.held=TOK_SUPPLY*0.80;              // the pre-mine, disclosed on page 40
  t.hype=25; t.trust=55; t.holders=140; t.reserve=0; t.staking=false;
  t.soldQ=0; t.hist=[t.px];
  dispatch(U("dTokLaunch").replace("{g}",t.gen).replace("{n}",TOKEN_NAMES[t.idx].n),"win");
  dirty();
}
function promote(){
  const t=tok(), c=tokPromoCost();
  if(!t.live||S.debt<c) return;
  S.debt-=c; t.hype=Math.min(100,t.hype+18); dirty();
}
function seedLiquidity(){
  const t=tok(), c=tokSeedCost();
  if(!t.live||S.debt<c) return;
  S.debt-=c; t.reserve+=c; t.trust=Math.min(100,t.trust+9); dirty();
}
function toggleStaking(){
  const t=tok(); if(!t.live) return;
  t.staking=!t.staking;
  dispatch(t.staking?U("dStakeOn"):U("dStakeOff"),"");
  dirty();
}
/* Selling is the whole tension: it is the only way to realise anything, and it
   is the thing that destroys the price and the trust you spent §  building. */
function tokSell(pct){
  const t=tok(); if(!t.live) return;
  const units=t.held*pct; if(units<=0) return;
  const slip=1-Math.min(0.55,pct*0.6);
  const proceeds=(units/TOK_SUPPLY)*t.mcap*slip;
  t.held-=units;
  // dumping a share f of total supply takes the cap down with it, hard
  const f=units/TOK_SUPPLY;
  t.mcap=Math.max(t.launchMcap*0.005, t.mcap*(1-Math.min(0.80,f*1.4)));
  t.px=tokPx();
  t.trust=Math.max(0,t.trust-pct*75);
  t.soldQ+=pct; t.raised+=proceeds;
  S.debt+=proceeds; S.runTotal+=proceeds; S.allTime+=proceeds;
  if(S.runTotal>S.bestRun) S.bestRun=S.runTotal;
  dirty();
}
function rugValue(){ const t=tok(); return (t.held/TOK_SUPPLY)*t.mcap*0.35 + t.reserve; }
function rugPull(){
  const t=tok(); if(!t.live) return;
  const proceeds=rugValue();
  showModal(U("mRugTitle"),
    "<p>"+U("mRug1")+"</p>"+
    "<p style='color:#ffe58a'>"+U("mRugRealised")+" "+money(proceeds)+"</p>"+
    "<p style='color:#d92d43'>"+U("mRug2").replace("{n}",TOKEN_NAMES[t.idx].n)+"</p>"+
    "<p style='color:#8a8199'>"+U("mRug3").replace("{g}",(t.gen+1))+"</p>",
    [{t:U("btnNotYet"),f:closeModal},{t:U("btnPullIt"),f:()=>{
      S.debt+=proceeds; S.runTotal+=proceeds; S.allTime+=proceeds;
      if(S.runTotal>S.bestRun) S.bestRun=S.runTotal;
      t.raised+=proceeds;
      t.live=false; t.dead=true; t.held=0; t.mcap=t.launchMcap*0.005; t.px=tokPx();
      t.trust=0; t.hype=0; t.holders=0; t.reserve=0; t.staking=false;
      S.unrest=Math.min(100,S.unrest+18);
      mkt().susp=Math.min(120,mkt().susp+30);
      dispatch(U("dRug").replace("{n}",TOKEN_NAMES[t.idx].n).replace("{m}",money(proceeds)),"evt");
      closeModal(); dirty();
    }}]);
}
function moveToken(){
  const t=tok(); if(!t.live) return;
  const trustF=t.trust/100;
  // adoption compounds only while the thing is both hyped and believed
  const inflow=t.holders*(t.hype/100)*0.30*trustF*(t.staking?1.7:1)+t.hype*0.8;
  t.holders=Math.max(0,t.holders+inflow-t.holders*0.09);
  /* Saturation: every hype cycle eventually runs out of people who have not
     heard of it yet. Without this, holding forever is strictly optimal and the
     token has no peak to time. */
  const sat=1/(1+t.mcap/(t.launchMcap*TOK_SAT));
  const growth=TOK_GROWTH*(t.hype/100)*trustF*sat + 0.03*(trustF-0.4) - t.soldQ*1.2 - 0.05;
  t.mcap=Math.max(t.launchMcap*0.005, t.mcap*Math.max(0.35,Math.min(1.9,1+growth)));
  t.px=tokPx();
  if(t.soldQ===0) t.trust=Math.min(100,t.trust+2.5);
  t.hype*=0.82;
  if(t.staking){
    // the yield is owed on everything the public holds, so it grows as you cash out
    const owed=tokPublicPct()*t.mcap*0.05;
    t.reserve-=owed;
    if(t.reserve<=0){
      t.reserve=0; t.trust=Math.max(0,t.trust-22);
      dispatch(U("dStakeMissed"),"evt");
    }
  }
  if(t.trust<=3 && t.holders<25 && t.mcap<=t.launchMcap*0.03){
    t.live=false; t.dead=true;
    dispatch(U("dTokZero").replace("{n}",TOKEN_NAMES[t.idx].n),"evt");
  }
  t.soldQ=0;
  t.hist.push(t.px); if(t.hist.length>26) t.hist.shift();
}

const war=()=>{ if(!S.war) S.war=freshWar(); return S.war; };

  return v; }
const warInc      = ()=>warReward("inc");
const warCostMult = ()=>{ let m=1; for(const t of TARGETS) if(warWon(t.id)&&t.reward.cost_) m*=(1-t.reward.cost_); return m; };
const warCalm     = ()=>{ let m=1; for(const t of TARGETS) if(warWon(t.id)&&t.reward.calm) m*=(1-t.reward.calm); return m; };
const warSlots    = ()=>warReward("slot");
const warThresh   = ()=>warReward("thresh");
const warFine     = ()=>warReward("fine");
const warSuspDecay= ()=>{ let m=1; for(const t of TARGETS) if(warWon(t.id)&&t.reward.suspDecay) m*=t.reward.suspDecay; return m; };
function infPerQuarter(){ let c=INF_BASE_CAP; for(const t of TARGETS) if(warWon(t.id)&&t.reward.cap) c+=t.reward.cap; return c; }
function infCost(){ return Math.max(1e3, income()*QSEC*INF_TAX/infPerQuarter()); }
/* A target is engaged while it has pressure on it and has not fallen. */
const warEngaged=id=>!warWon(id)&&(war().applied[id]||0)>0;
function warDebuff(){ let m=1;
  for(const t of TARGETS) if(warEngaged(t.id)&&t.counter.inc) m*=(1-t.counter.inc);
  return m; }
function tierOpen(tier){
  if(tier===1) return true;
  const prev=TARGETS.filter(t=>t.tier===tier-1&&warWon(t.id)).length;
  return prev>=2;
}
function buyInfluence(n){
  const w=war(), room=infPerQuarter()-w.bought;
  const k=Math.min(n,room); if(k<=0) return;
  const cost=infCost()*k; if(S.debt<cost) return;
  S.debt-=cost; w.inf+=k; w.bought+=k; dirty();
}
function commit(id,n){
  const w=war(), t=TARGETS.find(x=>x.id===id);
  if(!t||warWon(id)||!tierOpen(t.tier)) return;
  const k=Math.min(n,w.inf); if(k<=0) return;
  w.inf-=k; w.applied[id]=(w.applied[id]||0)+k; w.touched[id]=1;
  if(w.applied[id]>=t.resolve){
    w.won[id]=true; delete w.applied[id];
    S.war.inf+=Math.floor(t.resolve*0.15);
    dispatch(U("dWarWon").replace("{n}",t.name).replace("{r}",t.rw),"win");
    showModal(U("mWarTitle").replace("{n}",t.name),
      "<p>"+t.ds+"</p><p style='color:#4fd18b'>"+t.rw+"</p>"+
      "<p style='color:#8a8199'>"+U("mWarSpoils").replace("{n}",Math.floor(t.resolve*0.15))+"</p>",
      [{t:U("btnNext"),f:closeModal}]);
  }
  dirty();
}
function warQuarter(){
  const w=war(); w.bought=0;
  w.inf+=1;                                   // standing, accrued whether you use it or not
  for(const t of TARGETS){
    if(warWon(t.id)) continue;
    const a=w.applied[t.id]||0;
    if(a<=0) continue;
    if(t.counter.susp)   mkt().susp=Math.min(120,mkt().susp+t.counter.susp);
    if(t.counter.unrest) S.unrest=Math.min(100,S.unrest+t.counter.unrest);
    if(!w.touched[t.id]) w.applied[t.id]=Math.max(0,a*(1-INF_DECAY));   // pressure slips
  }
  w.touched={};
}

/* ==========================================================================
   CHAPTER V — MONETARY REFORM
   The meta-prestige. A crisis collapses your institution; a reform collapses
   the unit of account itself and reissues it in your name. Everything below
   goes: operations, doctrines, the Pyramid, the token, the conflicts, even the

const DENOM={id:"denomX",base:75,grow:1.42,name:"An Additional Denomination",
  ds:"Another note, another zero, another rounding in your favour. All income ×1.25 per denomination."};

const hasCh=id=>!!(S.charter&&S.charter[id]);
function chSum(k){ let v=0; for(const c of CHARTER) if(hasCh(c.id)&&c[k]) v+=c[k]; return v; }
function chProd(k){ let v=1; for(const c of CHARTER) if(hasCh(c.id)&&c[k]) v*=c[k]; return v; }
const denomLvl  = ()=>(S.charter&&S.charter.denomX)||0;
const denomCost = ()=>Math.ceil(DENOM.base*Math.pow(DENOM.grow,denomLvl()));
const chInc     = ()=>chProd("inc")*Math.pow(1.25,denomLvl());
const chCalm    = ()=>{ let m=1; for(const c of CHARTER) if(hasCh(c.id)&&c.calm) m*=(1-c.calm); return m; };
const chShare   = ()=>chSum("share");
const chSeign   = ()=>chProd("seign");
const chKeep    = ()=>chSum("keep");
const chMaxRate = ()=>hasCh("board")?35:0;

function chapterNeed(id){
  const n=CHAPTERS.find(c=>c.id===id).need;
  return hasCh("standing")?Math.ceil(n/2):n;
}
/* Seigniorage is priced on the era you are ending: how much you originated,
   how many collapses you staged, and how much of the machine you actually built. */
const SEIGN_EXP=0.17, SEIGN_COEF=1.30;   // flattened: a very long first era no longer buys half the Charter
function reformYield(){
  /* Driven mostly by how much the era originated, which compounds era on era as
     the Charter thickens. The completion term is deliberately small: finishing
     the content of one era should not buy half the Charter outright. */
  const base=Math.floor(Math.pow(Math.max(0,S.allTime)/1e12,SEIGN_EXP)*SEIGN_COEF);
  const built=Math.floor((Object.keys(war().won).length + Object.keys(S.nodes).length +
    Object.keys(S.dosDone).length + tok().gen + S.crises/2)/6);
  return Math.max(0,Math.floor((base+built)*chSeign()));
}
const canReform=()=>chapterOpen("reform") && reformYield()>0;

function buyCharter(c){
  if(hasCh(c.id)||S.seign<c.cost) return;
  const i=CHARTER.indexOf(c);
  if(i>0 && !hasCh(CHARTER[i-1].id)) return;      // the charter is written in order

}
function buyDenom(){

  dispatch(U("dDenom"),"win");
  dirty();
}
/* Starting bonuses are re-applied at the beginning of every era. */
function applyCharterStart(){

}
function doReform(){

    U("mRefStop")+" "+U("mRefErased2")+"</p>"+

    [{t:U("btnNotYet"),f:closeModal},{t:U("btnReissue"),f:()=>{

        charter:S.charter, grandTotal:S.grandTotal+S.allTime, started:S.started, disp:S.disp};

/* ---------- balance tuning ----------
   Single place to re-pace the game. Verified with a headless 24h simulation. */
const RATE_SCALE=1.76;   // output per operation
const DOC_SCALE=0.66;    // doctrine prices and unlock thresholds
GENS.forEach(g=>{ g.rate*=RATE_SCALE; });
UPS.forEach(u=>{ u.cost=Math.round(u.cost*DOC_SCALE);
  if(u.req.debt!==undefined) u.req.debt=Math.round(u.req.debt*DOC_SCALE); });

/* ---------- state ---------- */
function freshRun(){
  return { debt:0, runTotal:0, clicks:0,
    gens:GENS.map(()=>0), ups:{},
    rate:0, ratePending:null, unrest:0,
    revoltEnd:-1, revoltRate:0, brink:-1 };
}
function freshGame(){
  return Object.assign(freshRun(),{
    t:0, q:0, qAcc:0,
    assets:0, assetsEarned:0, crisisAssets:0, nodes:{}, caps:{},
    crises:0, revolts:0, allTime:0, bestRun:0,
    hiStreak:0, calmStreak:0,
    f_revolt:0, f_bail:0,
    tok:freshToken(), war:freshWar(), mkt:freshMarket(),
    dosDone:{}, dosActive:[], dosClaim:{}, coldDone:0, reaff:0,
    disp:[], seenDos:false,
    era:1, reforms:0, seign:0, seignEarned:0, charter:{}, grandTotal:0, unlocked:{ops:true},
    ending:null, endings:{}
  });
}
let S=freshGame();
let buyMode=1;

/* ---------- node effects ---------- */
const has=id=>!!S.nodes[id];
function nodeSum(k){ let v=0; for(const n of ALLNODES) if(has(n.id)&&n[k]) v+=n[k]; return v; }
function nodeProd(k){ let v=1; for(const n of ALLNODES) if(has(n.id)&&n[k]) v*=n[k]; return v; }
const nodeInc      = ()=>nodeProd("inc");
const nodeCostMult = ()=>{ let m=1; for(const n of ALLNODES) if(has(n.id)&&n.cost_) m*=(1-n.cost_); return m*warCostMult(); };
const nodeCalm     = ()=>{ let m=1; for(const n of ALLNODES) if(has(n.id)&&n.calm) m*=(1-n.calm); return m; };
const maxRate      = ()=>Math.max(has("s2")?35:25, chMaxRate());
const revoltFactor = ()=>nodeSum("softrevolt")?0.70:0.40;
const crisisThresh = ()=>Math.max(10,(has("s5")?20:35)-warThresh());
const dosSlots     = ()=>1+nodeSum("slot")+warSlots();
const dosRewMult   = ()=>(has("i3")?1.5:1)*capDrew();
const keepOnCrisis  =()=>has("c5")?0.10:0;
const noLag        = ()=>has("i2");

/* ---------- doctrine effects ---------- */
const SHARE_UPS=[
 {id:"wetink",sig:"❥",name:"The Wet-Ink Bonus",cost:9e5,kind:"share",v:0.004,
  ds:"A signature made in person is worth more, for reasons nobody has ever audited. Each signature also pays 0.4% of a second's income.",req:{debt:6e5}},
 {id:"nightshift",sig:"☾",name:"Signing Room Night Shift",cost:7e7,kind:"share",v:0.006,
  ds:"The room never closes, because somewhere it is always a reasonable hour to borrow. +0.6% per signature.",req:{debt:5e7}},
 {id:"everypen",sig:"⑂",name:"Every Pen a Branch",cost:1.4e10,kind:"share",v:0.010,
  ds:"Each pen is now a legal entity, a cost centre and a small tax jurisdiction. +1% per signature.",req:{debt:9e9}},
 {id:"thehand",sig:"✋",name:"The Hand That Signs",cost:8e12,kind:"share",v:0.020,
  ds:"It is no longer clear whose hand it is. The signature is valid regardless. +2% per signature.",req:{debt:5e12}}
];
UPS.push.apply(UPS,SHARE_UPS);

function upProd(kind,g){
  let m=1;
  for(const u of UPS) if(S.ups[u.id]&&u.kind===kind&&(!g||u.g===g)) m*=u.v;
  return m;
}
const globMult  = ()=>upProd("glob");
const genMult   = id=>upProd("gen",id);
const clickMult = ()=>upProd("click");
const upCalm    = ()=>{ let m=1; for(const u of UPS) if(S.ups[u.id]&&u.kind==="calm") m*=(1-u.v); return m; };

/* ---------- economy ---------- */
const irMult    = ()=>1+S.rate*0.10;
const revolting = ()=>S.t < S.revoltEnd;
function income(){
  let base=0;
  GENS.forEach((g,i)=>{ base += (S.gens[i]||0)*g.rate*genMult(g.id)*tierMult(i); });
  let v=base*globMult()*irMult()*nodeInc()*capInc()*warInc()*warDebuff()*chInc()*reaffMult();
  if(revolting()) v*=revoltFactor();
  return v;
}
const clickShare=()=>{ let v=chShare(); for(const u of UPS) if(S.ups[u.id]&&u.kind==="share") v+=u.v; return v; };
const perClick = ()=>1*clickMult()+income()*clickShare();
/* Owning more of one instrument makes each unit better — the reward for going
   deep on a line instead of spreading thin. */
const TIERS=[10,25,50,100,150,200,300,450];
const TIER_MULT=1.55;
function tierCount(i){ let n=0; const g=S.gens[i]||0; for(const t of TIERS) if(g>=t) n++; return n; }
function tierMult(i){ return Math.pow(TIER_MULT,tierCount(i)); }
function nextTier(i){ const g=S.gens[i]||0; for(const t of TIERS) if(g<t) return t; return null; }
const CALM_FLOOR=0.30;
const calmTotal = ()=>Math.max(CALM_FLOOR, upCalm()*nodeCalm()*capCalm()*warCalm()*chCalm());
const unrestPerSec = ()=>S.rate*0.035*calmTotal()-0.18;

function unitCost(i,owned){ return GENS[i].cost*nodeCostMult()*Math.pow(COSTGROW,owned); }
function bulkCost(i,n){
  const b=unitCost(i,S.gens[i]);
  return b*(Math.pow(COSTGROW,n)-1)/(COSTGROW-1);
}
function maxAffordable(i){
  const b=unitCost(i,S.gens[i]);
  if(S.debt<b) return 0;
  const n=Math.floor(Math.log(1+S.debt*(COSTGROW-1)/b)/Math.log(COSTGROW));
  return Math.max(0,n);
}
function buyQty(i){
  if(buyMode==="max") return Math.max(1,maxAffordable(i));
  return buyMode;
}
/* Assets are a function of your BEST cycle, minus what previous collapses
   already paid out. Collapsing early and often therefore yields nothing —
   the only way forward is to go deeper than last time. */
const YIELD_COEF=2.0, YIELD_EXP=0.285;
const MIN_CYCLE=1.5e6;      // a cycle smaller than this is not worth collapsing at all
function assetsDeserved(){
  if(S.runTotal<MIN_CYCLE) return 0;
  return Math.floor(Math.pow(S.runTotal/1e6,YIELD_EXP)*YIELD_COEF);
}
function crisisYield(){ return Math.max(0, assetsDeserved()-S.crisisAssets); }
/* On collapse the institution is recapitalised: without this the player would
   have to hand-click their way out of every prestige, which is the opposite of
   what this game is for. */
function startingStake(){ return Math.max(60, 40*Math.sqrt(S.bestRun)); }
/* runTotal the next collapse must beat before it pays anything at all */
function nextAssetBar(){
  /* Nudged up by a hair: at very large values the double-precision round trip
     through pow() can land a fraction below the floor() boundary, so the figure
     printed to the player would be reached without the button waking up. */
  const raw=1e6*Math.pow((S.crisisAssets+1)/YIELD_COEF,1/YIELD_EXP)*(1+1e-9);
  return Math.max(MIN_CYCLE, raw);
}

/* ---------- visibility ---------- */
const genVisible = i => (!GENS[i].era||S.era>=GENS[i].era) &&
  (i===0 || S.gens[i-1]>0 || S.allTime>=GENS[i].cost*0.3);
function upAvailable(u){
  if(S.ups[u.id]) return false;
  if(u.era&&S.era<u.era) return false;
  if(u.req.debt!==undefined) return S.allTime>=u.req.debt;
  return S.gens[GENS.findIndex(g=>g.id===u.req.gen)]>=u.req.n;
}
function upVisible(u){
  if(S.ups[u.id]) return true;
  if(u.era&&S.era<u.era) return false;
  if(u.req.debt!==undefined) return S.allTime>=u.req.debt*0.5;
  return S.gens[GENS.findIndex(g=>g.id===u.req.gen)]>=Math.ceil(u.req.n*0.5);
}
function nodeState(n){
  if(has(n.id)) return "have";
  if(n.era&&S.era<n.era) return "era";      // exists, but not in this era
  const branch=Object.values(TREE).find(b=>b.nodes.some(x=>x.id===n.id));
  const idx=branch.nodes.indexOf(n);
  if(idx>0 && !has(branch.nodes[idx-1].id)) return "lock";
  return S.assets>=n.cost ? "can" : "wait";
}
const dosUnlocked = ()=>stageOpen("dos");
function dosOfferable(){
  const undone=allDos().filter(d=>!S.dosDone[d.id]);
  return undone.slice(0,dosSlots()+2);
}

/* ---------- actions ---------- */
const $=s=>document.querySelector(s);
function gain(n){ S.debt+=n; S.runTotal+=n; S.allTime+=n; if(S.runTotal>S.bestRun) S.bestRun=S.runTotal; }
function dispatch(txt,cls){
  S.disp.unshift({q:qName(S.q),t:txt,c:cls||""});
  if(S.disp.length>60) S.disp.pop();
}

/* Below a million the float shows the exact figure — "+§204,567" rather than a
   3-significant-figure "+§205K", which read as if clicks were paying less than
   they credited. Positions are jittered so a held space bar shows every click
   instead of stacking them all on one pixel. */
function clickText(v){
  if(v<1e6) return "+§"+Math.round(v).toLocaleString("en-US");
  return "+"+money(v);
}
function doClick(ev){
  const v=perClick(); gain(v); S.clicks++;
  const host=$("#floats");
  if(host.childElementCount<45){
    const f=document.createElement("div");
    f.className="float"; f.textContent=clickText(v);
    const jx=(Math.random()-0.5)*74, jy=(Math.random()-0.5)*30;
    f.style.left=(((ev&&ev.clientX)||window.innerWidth*.22)+jx)+"px";
    f.style.top=((((ev&&ev.clientY)||window.innerHeight*.5)-12)+jy)+"px";
    host.appendChild(f); setTimeout(()=>f.remove(),1150);
  }
  paint();
}
function buyGen(i){
  let n=buyQty(i);
  let c=bulkCost(i,n);
  if(c>S.debt){ n=maxAffordable(i); if(n<1) return; c=bulkCost(i,n); }
  S.debt-=c; S.gens[i]+=n; dirty();
}
function buyUp(u){
  if(!upAvailable(u)||S.debt<u.cost) return;
  S.debt-=u.cost; S.ups[u.id]=true; dirty();
}
/* Cheapest first, so one click never spends the budget on the expensive one and
   leaves three affordable ones behind. */
function buyAllUps(){
  let bought=0;
  for(;;){
    const next=UPS.filter(u=>upAvailable(u)&&S.debt>=u.cost).sort((a,b)=>a.cost-b.cost)[0];
    if(!next) break;
    S.debt-=next.cost; S.ups[next.id]=true; bought++;
  }
  if(bought) dispatch((bought>1?U("dBulkDocN"):U("dBulkDoc1")).replace("{n}",bought),"");
  dirty();
}
function buyCap(c){
  const k=capCost(c);
  if(S.assets<k) return;
  S.assets-=k; S.caps[c.id]=capLvl(c.id)+1;
  dispatch(U("dCap").replace("{n}",c.name).replace("{l}",capLvl(c.id)),"win");
  dirty();
}
function buyNode(n){
  if(nodeState(n)!=="can") return;
  S.assets-=n.cost; S.nodes[n.id]=true;
  dispatch(U("dNode").replace("{n}",n.name),"win");
  if(n.maxrate) $("#ir").max=maxRate();
  dirty();
}

/* ---------- quarter tick ---------- */
function endQuarter(){
  const inc=income();
  if(S.rate>=16) S.hiStreak++; else S.hiStreak=0;
  if(S.unrest<25) S.calmStreak++; else S.calmStreak=0;
  const oldRate=S.rate;
  if(S.ratePending!==null){
    S.rate=S.ratePending; S.ratePending=null;
    dispatch(U("dRate").replace("{r}",S.rate),"");
  }
  if(chapterOpen("market")) moveMarket(S.rate-oldRate);
  if(chapterOpen("token"))  moveToken();
  if(chapterOpen("conflict")) warQuarter();
  S.q++;
  dispatch(U("dQuarter").replace("{m}",money(inc*QSEC)).replace("{u}",S.unrest.toFixed(0)).replace("{r}",S.rate),"");
  checkDossiers();
}
function triggerRevolt(){
  S.revolts++; S.unrest=58;
  S.revoltEnd=S.t+QSEC*2;
  S.revoltRate=S.rate;
  $("#flash").classList.add("on"); setTimeout(()=>$("#flash").classList.remove("on"),750);
  dispatch(U("dRevolt").replace("{p}",Math.round(revoltFactor()*100)),"evt");
  showModal(U("mRevoltTitle"),
   "<p>"+U("mRevolt1")+"</p>"+
   "<p style='color:#d92d43'>"+U("mRevolt2").replace("{p}",Math.round(revoltFactor()*100))+"</p>"+
   "<p style='color:#8a8199'>"+U("mRevolt3")+"</p>",
   [{t:U("btnDeny"),f:closeModal}]);
}
function endRevolt(){
  if(S.rate>=S.revoltRate && S.revoltRate>0) S.f_revolt=1;
  S.revoltEnd=-1;
  dispatch(U("dOrder"),"");
}

/* ---------- dossiers ---------- */
function acceptDos(d){
  if(S.dosActive.length>=dosSlots()||S.dosActive.includes(d.id)) return;
  S.dosActive.push(d.id);
  dispatch(U("dDosOpen").replace("{n}",d.name),"");
  dirty();
}
function checkDossiers(){
  for(const id of S.dosActive){
    const d=findDos(id);
    if(d&&d.cur()>=d.need) S.dosClaim[id]=true;
  }
}
function claimDos(d){
  if(!S.dosClaim[d.id]) return;
  const rw=Math.max(1,Math.round(d.rew*dosRewMult()));
  S.assets+=rw; S.assetsEarned+=rw;
  S.dosDone[d.id]=true;
  if(d.cold) S.coldDone=(S.coldDone||0)+1;
  delete S.dosClaim[d.id];
  S.dosActive=S.dosActive.filter(x=>x!==d.id);
  dispatch(U("dDosClose").replace("{n}",d.name).replace("{a}",rw),"win");
  showModal(U("mDosTitle").replace("{n}",d.name),
    "<p>"+d.bd+"</p><p style='color:#ffe58a'>"+U("mDosAcquired").replace("{n}",rw)+"</p>"+
    "<p style='color:#8a8199'>"+U("mDos2")+"</p>",
    [{t:U("btnFile"),f:closeModal}]);
  dirty();
}

/* ---------- crisis ---------- */
function doCrisis(){
  const y=crisisYield();
  if(S.unrest<crisisThresh()||y<1) return;
  const inc=income();
  showModal(U("mCrisisTitle"),
   "<p>"+U("mCrisis1")+"</p>"+
   "<p>"+U("mCrisisSeized")+" <b style='color:#ffe58a'>"+fmt(y)+" "+U("crisisAssets")+"</b></p>"+
   "<p style='color:#4fd18b'>"+U("mCrisisRecap").replace("{m}",money(startingStake()))+"</p>"+
   (portfolioValue()>0?"<p style='color:#7fb2d9'>"+U("mCrisisEquity")+"</p>":"")+
   "<p style='color:#8a8199'>"+U("mCrisisBest")+"</p>"+
   "<p style='color:#d92d43'>"+U("mCrisisWipes1")+(keepOnCrisis()?U("mCrisisRetain"):"")+
   U("mCrisisWipes2")+"</p>",
   [{t:U("btnNotYet"),f:closeModal},{t:U("btnLetFall"),f:()=>{
      if(inc>=4e6) S.f_bail=1;
      S.assets+=y; S.assetsEarned+=y; S.crisisAssets+=y; S.crises++;
      const kept=keepOnCrisis()?S.gens.map(v=>Math.floor(v*keepOnCrisis())):GENS.map(()=>0);
      /* Your equity is held offshore and survives the collapse — but the
         collapse is precisely what moves those prices, in both directions. */
      for(const x of SECTORS) S.mkt.px[x.id]=Math.max(4,S.mkt.px[x.id]*x.crash);
      /* Keep EVERYTHING, then overwrite only the per-cycle fields freshRun()
         defines. The previous version listed what to KEEP, and every field added
         afterwards — the era, the Charter, the seigniorage, the cold cases — was
         silently dropped on the next crisis. A keep-list always drifts. */
      S=Object.assign({},S,freshRun());
      S.hiStreak=0; S.calmStreak=0;
      S.gens=kept;
      S.debt=startingStake();
      $("#ir").value=0; $("#ir").max=maxRate();
      dispatch(U("dCrisis").replace("{a}",fmt(y)).replace("{m}",money(S.debt)),"evt");
      checkDossiers(); closeModal(); dirty();
   }}]);
}

/* ---------- modal / save ---------- */
function showModal(title,html,btns){
  $("#card").innerHTML="<h2>"+title+"</h2>"+html+"<div class='row'>"+
    btns.map((b,i)=>"<button class='hbtn' data-b='"+i+"'>"+b.t+"</button>").join("")+"</div>";
  $("#card").querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>btns[+el.dataset.b].f());
  $("#modal").classList.add("on");
}
const closeModal=()=>$("#modal").classList.remove("on");
function exportSave(){
  const str=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  showModal(U("mExportTitle"),"<p>"+U("mExport1")+"</p>"+
    "<textarea id='sv' readonly>"+str+"</textarea>",[{t:U("btnClose"),f:closeModal}]);
  setTimeout(()=>{const t=$("#sv");if(t){t.focus();t.select();}},60);
}
function importSave(){
  showModal(U("mImportTitle"),"<p>"+U("mImport1")+"</p>"+
    "<textarea id='sv' placeholder='"+U("phPaste")+"'></textarea>",
    [{t:U("btnCancel"),f:closeModal},{t:U("btnRestore"),f:()=>{
      try{
        const o=JSON.parse(decodeURIComponent(escape(atob($("#sv").value.trim()))));
        if(typeof o.debt!=="number"||!Array.isArray(o.gens)) throw 0;
        S=Object.assign(freshGame(),o);
        while(S.gens.length<GENS.length) S.gens.push(0);
        healNested(); saveBlocked=false;
        $("#ir").max=maxRate(); $("#ir").value=S.ratePending!==null?S.ratePending:S.rate;
        saveGame(); closeModal(); dirty();
      }catch(e){ showModal(U("mUnreadTitle"),
        "<p>"+U("mUnread1")+"</p>",[{t:U("btnClose"),f:closeModal}]); }
    }}]);
}

/* ---------- rendering ---------- */
let keys={}, force=false;
const dirty=()=>{keys={};force=true;paint();};
function panel(id,key,build){
  if(keys[id]===key&&!force) return false;
  keys[id]=key; $("#p"+id).innerHTML=build(); return true;
}

function paint(){
  const inc=income();
  $("#debt").textContent=money(S.debt);
  $("#rate").innerHTML=(revolting()?"⚠ ":"+")+fmt(inc)+" "+U("perSec")+" &nbsp;<b>"+money(inc*QSEC)+" "+U("perQuarter")+"</b>";
  $("#rate").style.color=revolting()?"#d92d43":"var(--green)";
  $("#signSub").textContent="+"+money(perClick())+" "+U("perSig");
  $("#qLbl").textContent=qName(S.q);
  const TABL={Ops:"tabOps",Doc:"tabDoc",Dos:"tabDos",Pyr:"tabPyr",Mkt:"tabMkt",
              Tok:"tabTok",War:"tabWar",Ref:"tabRef",Led:"tabLed"};
  document.querySelectorAll(".tab").forEach(t=>{
    const l=t.querySelector(".tl"); if(l) l.textContent=U(TABL[t.dataset.p]||"");
  });
  $("#signLbl").textContent=U("sign");
  $("#debtLbl").textContent=U("debtLabel");
  $("#prLbl").textContent=U("policyRate");
  $("#cuLbl").textContent=U("civilUnrest");
  $("#saLbl").textContent=U("seized");
  $("#saNote").innerHTML=U("seizedNote");
  $("#btnSave").textContent=U("export");
  $("#btnLoad").textContent=U("import_");
  $("#btnWipe").textContent=U("wipe");
  const open=CHAPTERS.filter(c=>chapterOpen(c.id)).pop();
  $("#chapLbl").textContent = (S.reforms>0?U("eraWord")+" "+S.era+" · ":"")+
    (open ? U("chapPrefix")+" "+open.n+" — "+chapName(open) : U("chapI"));
  $("#qBar").style.width=(S.qAcc/QSEC*100)+"%";

  const shown=S.ratePending!==null?S.ratePending:S.rate;
  $("#irLbl").innerHTML=S.rate+"%"+(S.ratePending!==null&&S.ratePending!==S.rate?
    " <span class='pend'>→ "+S.ratePending+"%</span>":"");
  $("#irHint").innerHTML=U("yield_")+" ×"+irMult().toFixed(2)+" · "+U("unrestWord")+" "+(unrestPerSec()>=0?"+":"")+
    unrestPerSec().toFixed(2)+"/s"+
    (S.ratePending!==null&&S.ratePending!==S.rate?
      "<br><span class='pend'>"+U("pendingAt")+" "+qName(S.q+1)+".</span>":
      (noLag()?"<br>"+U("advNotice"):"<br>"+U("takesEffect")))
;

  const u=Math.max(0,Math.min(100,S.unrest));
  $("#unLbl").textContent=u.toFixed(0)+"%";
  $("#unBar").style.width=u+"%";
  $("#unMeter").classList.toggle("hot",u>=80);
  if(S.brink>0){
    $("#unHint").innerHTML="<span style='color:#d92d43'>"+U("brink")+" — "+
      Math.max(0,(S.brink-S.t)).toFixed(1)+"s "+U("brinkTail")+"</span>";
    $("#unMeter").classList.add("hot");
  } else
  $("#unHint").textContent = u<15?U("u1"):u<40?U("u2"):u<70?U("u3"):u<90?U("u4"):U("u5");

  const y=crisisYield(), th=crisisThresh();
  const cb=$("#crisis");
  cb.disabled=!(S.unrest>=th&&y>=1);
  cb.textContent = y<1 ? U("crisisNo") :
    S.unrest<th ? U("crisisBtn")+" — "+U("crisisNeeds")+" "+th+"% "+U("crisisUnrest") :
    U("crisisBtn")+"  ▸  +"+fmt(y)+" "+U("crisisAssets");
  $("#cHint").innerHTML = y>=1
    ? (S.unrest>=th?U("crisisReady")+" "+fmt(y)+" "+U("crisisAssets")+"."
                   :U("crisisWorth")+" "+fmt(y)+" "+U("crisisAssets")+" — "+th+"% "+U("crisisUnrest")+".")
    : U("crisisBar1")+" "+money(nextAssetBar())+" "+U("crisisBar2")+" "+money(S.runTotal)+" ("+
      Math.min(99,Math.floor(S.runTotal/nextAssetBar()*100))+"%).";

  refreshUnlocks();
  const pyr=stageOpen("pyr");
  $("#crisis").style.display=pyr?"":"none";
  $("#cHint").style.display=pyr?"":"none";
  const nx=nextStage();
  $("#nextObj").innerHTML = nx
    ? "<span style='color:var(--gold)'>"+U("next")+" — "+nx.name+"</span><br>"+
      "<span style='color:#57506a'>"+U("openedFrom")+" "+(stage(CHAIN[CHAIN.indexOf(nx)-1].id)||{}).name+"</span><br>"+stageProgress(nx)
    : "<span style='color:var(--green)'>"+U("allOpen")+"</span>";
  $("#assetBox").style.display=S.assetsEarned>0?"":"none";
  $("#asLbl").textContent=fmt(S.assets)+(S.assetsEarned>S.assets?" / "+fmt(S.assetsEarned)+" "+U("seizedEarned"):"");

  /* A locked system is not shown at all — a greyed tab is a promise the player
     cannot act on, and eight of them at once reads as a broken game. */
  for(const c of CHAIN){
    const el=document.querySelector('.tab[data-p="'+c.tab+'"]');
    if(!el) continue;
    /* The Reform tab is the exception: once you have ever reissued the currency
       you keep the Charter and the seigniorage, so the place to spend them must
       stay reachable even though the chain around it has just reset. */
    const keep=(c.id==="ref") && (S.reforms>0||S.seignEarned>0);
    el.style.display=(stageOpen(c.id)||keep)?"":"none";
  }
  /* A reform hides the tab you are standing on. Fall back to Operations rather
     than leaving the player on a pane whose tab no longer exists. */
  const act=document.querySelector(".tab.on");
  if(act&&act.style.display==="none"){
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
    document.querySelector('.tab[data-p="Ops"]').classList.add("on");
    $("#pOps").classList.add("on");
  }
  const refSeen=stageOpen("ref")||S.reforms>0||S.seignEarned>0;
  $("#dRef").style.display=(refSeen&&(canReform()||CHARTER.some(c=>{
    const i=CHARTER.indexOf(c); return !hasCh(c.id)&&S.seign>=c.cost&&(i===0||hasCh(CHARTER[i-1].id));})))
    ?"inline-block":"none";
  $("#dWar").style.display=(stageOpen("war")&&war().inf>0)?"inline-block":"none";
  $("#dTok").style.display=(stageOpen("tok")&&(!tok().live||tok().hype<12))?"inline-block":"none";
  $("#dMkt").style.display=(stageOpen("mkt")&&mkt().susp>=60)?"inline-block":"none";
  $("#dOps").style.display=GENS.some((g,i)=>genVisible(i)&&S.debt>=bulkCost(i,1))?"inline-block":"none";
  $("#dDoc").style.display=UPS.some(x=>upAvailable(x)&&S.debt>=x.cost)?"inline-block":"none";
  $("#dDos").style.display=(dosUnlocked()&&(Object.keys(S.dosClaim).length||
    (S.dosActive.length<dosSlots()&&dosOfferable().some(d=>!S.dosActive.includes(d.id)))))?"inline-block":"none";
  $("#dPyr").style.display=ALLNODES.some(n=>nodeState(n)==="can")?"inline-block":"none";

  renderOps(); renderDoc(); renderDos(); renderPyr(); renderMkt(); renderTok(); renderWar(); renderRef(); renderLed();
  force=false;
}

function renderOps(){
  const vis=GENS.map((g,i)=>i).filter(genVisible);
  const key=vis.join()+"|"+S.gens.join()+"|"+Object.keys(S.ups).join()+"|"+buyMode+"|"+Object.keys(S.nodes).join()+"|"+GENS.map((g,i)=>tierCount(i)).join();
  panel("Ops",key,()=>
    "<div class='paneHead'><div class='sect'>"+U("instruments")+"</div><div class='mults'>"+
    [1,10,100,"max"].map(m=>"<button class='mult"+(buyMode===m?" on":"")+"' data-m='"+m+"'>"+
      (m==="max"?"MAX":"×"+m)+"</button>").join("")+"</div></div>"+
    vis.map(i=>{
      const g=GENS[i], each=g.rate*genMult(g.id)*tierMult(i);
      return "<div class='item' data-g='"+i+"'><div class='sig'>"+g.sig+"</div>"+
        "<div><div class='nm'>"+g.name+"</div><div class='ds'>"+g.ds+"</div>"+
        "<div class='rt'>"+fmt(each)+"/s "+U("each")+(S.gens[i]?" · "+fmt(each*S.gens[i])+"/s "+U("total"):"")+
          (tierCount(i)?" · <span style='color:var(--gold-hot)'>"+U("tier")+" ×"+fmt(tierMult(i))+"</span>":"")+
          (nextTier(i)!==null?" <span style='color:#8a8199'>(×"+TIER_MULT+" "+U("at")+" "+nextTier(i)+")</span>":"")+
        "</div></div>"+
        "<div class='buy'><div class='cost' id='gc"+i+"'></div><div class='cnt' id='gn"+i+"'></div></div></div>";
    }).join("")
  );
  const p=$("#pOps");
  p.querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>buyGen(+el.dataset.g));
  p.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{
    buyMode=el.dataset.m==="max"?"max":+el.dataset.m; dirty();

    if(ne) ne.textContent=(buyMode==="max"?U("buy")+" "+n+" · ":"×"+n+" · ")+U("owned")+" "+S.gens[i];
  });
}

            "|"+dosSlots()+"|"+off.map(d=>d.id+Math.min(1,d.cur()/d.need).toFixed(2)).join();
  panel("Dos",key,()=>{
    if(!dosUnlocked()) return "<div class='empty'>"+U("dosSealed")+"<br><br>"+U("dosSealed2")+"</div>";
    const done=DOSSIERS.filter(d=>S.dosDone[d.id]);

    let h="<div class='paneHead'><div class='sect'>"+U("dosOpen")+" — "+S.dosActive.length+" / "+dosSlots()+" "+U("dosSlots")+"</div></div>";

function dosCard(d,cls){

          "<div><div class='nm'>"+c.name+"</div><div class='ds'>"+c.nd+"</div>"+
          "<div class='rt'>"+U("pyrLevel")+" "+capLvl(c.id)+"</div></div>"+

function spark(id){
  const h=mkt().hist[id]; if(h.length<2) return "";
  const lo=Math.min.apply(null,h), hi=Math.max.apply(null,h), rng=(hi-lo)||1;
  const pts=h.map((v,i)=>(i/(h.length-1)*90+1).toFixed(1)+","+(24-(v-lo)/rng*22).toFixed(1)).join(" ");
  const rising=h[h.length-1]>=h[0];
  return "<svg class='spark' viewBox='0 0 92 26' preserveAspectRatio='none'>"+
    "<polyline points='"+pts+"' fill='none' stroke='"+(rising?"#4fd18b":"#d92d43")+
    "' stroke-width='1.4' vector-effect='non-scaling-stroke'/></svg>";
}

function renderWar(){
  const open=chapterOpen("conflict"), w=war();
  const key=open+"|"+S.crises+"|"+Math.round(w.inf)+"|"+w.bought+"|"+Object.keys(w.won).join()+
            "|"+TARGETS.map(t=>Math.round(w.applied[t.id]||0)).join()+"|"+(S.debt>=infCost()?1:0);
  panel("War",key,()=>{
    if(!open){
      return "<div class='empty'>"+U("warNone")+"<br><br>"+
        U("opensAny")+"<br>"+
        "&nbsp;· "+stageProgress(stage("war"))+"<br><br>"+
        U("warNone2")+"</div>";
    }
    const cap=infPerQuarter(), cost=infCost(), left=cap-w.bought;
    let h="<div class='paneHead'><div class='sect'>"+U("warTitle")+"</div></div>"+
      "<div class='ds' style='margin:-4px 0 10px'>"+U("warNote")+"</div>"+
      "<div class='infBar'><div><div class='infBig'>"+fmt(w.inf)+" "+U("warInfluence")+"</div>"+
      "<div class='ds'>"+U("warStanding")+" · "+w.bought+" / "+cap+" "+U("warPlaced")+" · "+
      money(cost)+" "+U("warEach")+"</div></div>"+
      "<button class='dbtn' data-inf='1' "+(left<1||S.debt<cost?"disabled":"")+">"+U("warPlace")+" 1</button>"+
      "<button class='dbtn' data-inf='5' "+(left<1||S.debt<cost?"disabled":"")+">"+U("warPlace")+" "+Math.min(5,Math.max(1,left))+"</button></div>";
    const dbf=warDebuff();
    if(dbf<1) h+="<div class='warn'>"+U("warDebuff")+" "+((1-dbf)*100).toFixed(0)+
      U("warDebuff2")+"</div>";
    for(const tier of [1,2,3]){
      const ts=TARGETS.filter(t=>t.tier===tier), opened=tierOpen(tier);
      h+="<div class='tierHead'>"+(tier===1?U("warT1"):tier===2?U("warT2"):U("warT3"))+
         (opened?"":" "+U("warSealedTier"))+"</div>";
      h+=ts.map(t=>{
        const won=warWon(t.id), a=w.applied[t.id]||0, pr=Math.min(1,a/t.resolve);
        const cls=won?"won":!opened?"shut":a>0?"eng":"";
        const cs=[]; if(t.counter.inc) cs.push("−"+(t.counter.inc*100).toFixed(0)+U("warIncome"));
        if(t.counter.unrest) cs.push("+"+t.counter.unrest+" "+U("warUnrestQ"));
        if(t.counter.susp) cs.push("+"+t.counter.susp+" "+U("warAttentionQ"));
        return "<div class='war "+cls+"'><div class='wt'><div class='wn'>"+t.sig+" &nbsp;"+t.name+"</div>"+
          "<div class='wr'>"+(won?"<span style='color:var(--green)'>"+U("warFallen")+"</span>"
            :fmt(a)+" / "+t.resolve+" "+U("warInfluence"))+"</div></div>"+
          "<div class='wd'>"+t.ds+"</div>"+
          (won?"":"<div class='wc'>"+U("warStands")+" "+cs.join(" · ")+"</div>")+
          "<div class='wg'>"+(won?"✓ ":U("warReward")+" ")+t.rw+"</div>"+
          (won?"":"<div class='wf'><div class='pbar'><i style='width:"+(pr*100)+"%'></i></div>"+
            "<button class='dbtn' data-c='"+t.id+"|1' "+(!opened||w.inf<1?"disabled":"")+">"+U("warCommit1")+"</button>"+
            "<button class='dbtn' data-c='"+t.id+"|999' "+(!opened||w.inf<1?"disabled":"")+">"+U("warCommitAll")+"</button></div>")+
          "</div>";
      }).join("");
    }
    return h;
  });
  $("#pWar").querySelectorAll("[data-inf]").forEach(el=>el.onclick=()=>buyInfluence(+el.dataset.inf));
  $("#pWar").querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{
    const [id,n]=el.dataset.c.split("|"); commit(id,+n);
  });
}

   A game about accumulation has to answer "and then what?". A game about debt
   has an answer built into its own premise: eventually there is nothing left
   to lend against. This is the only part of Debt Master that ends.
   ========================================================================== */
const charterComplete=()=>CHARTER.every(c=>hasCh(c.id));
const epilogueReady=()=>charterComplete()&&canReform();

const ENDINGS={

const MORAL=[
 "Nothing you did here required breaking a law.",
 "The fine was always smaller than the quarter that produced it. The settlement always admitted "+
 "nothing and named nobody. The arrangement was always drafted rather than invented — by people "+
 "who were paid well and slept soundly, because everything they did was permitted, and much of "+
 "it was permitted because someone in your position had asked, politely and at length, that it be.",

let MORAL_PUNCH="You did not win because the rules were broken. You won because you were "+
  "holding the pen while they were being written.";

function showEpilogue(){
  $("#epiBox").innerHTML=
    "<h1>"+U("epiTitle")+"</h1>"+
    "<div class='kicker'>"+U("epiKicker").replace("{e}",S.era).replace("{m}",money(S.grandTotal+S.allTime))+"</div>"+
    "<p>"+U("epi1")+"</p>"+
    "<p>"+U("epi2")+"</p>"+
    "<p class='dim'>"+U("epi3")+"</p>"+
    "<div class='epiChoice' data-e='jubilee'><b>"+U("epiJubilee")+"</b>"+
      "<span>"+U("epiJubileeDs")+"</span></div>"+
    "<div class='epiChoice' data-e='perpetuity'><b>"+U("epiPerp")+"</b>"+
      "<span>"+U("epiPerpDs")+"</span></div>"+
    "<div class='epiChoice' data-e='declined'><b>"+U("epiDecline")+"</b>"+
      "<span>"+U("epiDeclineDs")+"</span></div>";
  $("#epi").classList.add("on");
  $("#epiBox").querySelectorAll("[data-e]").forEach(el=>el.onclick=()=>chooseEnding(el.dataset.e));
}
function chooseEnding(id){
  const e=ENDINGS[id];
  S.ending=id; S.endings=S.endings||{}; S.endings[id]=true;
  dispatch(U("dEpilogue").replace("{n}",e.title),"win");
  const showMoral=id!=="declined";
  $("#epiBox").innerHTML=
    "<h1>"+e.title+"</h1><div class='kicker'>"+e.kicker+"</div>"+
    e.body.map(t=>"<p>"+t+"</p>").join("")+
    (showMoral?"<div class='moral'><h2>"+U("epiMoral")+"</h2>"+
      MORAL.map(t=>"<p>"+t+"</p>").join("")+
      "<p class='punch'>"+MORAL_PUNCH+"</p></div>":"")+
    "<div class='epiRow'>"+
      "<button class='epiBtn' id='epiStay'>"+(showMoral?U("epiRemain"):U("epiContinue"))+"</button>"+
      (showMoral?"<button class='epiBtn quiet' id='epiAgain'>"+U("epiAgain")+"</button>":"")+
    "</div>"+
    (showMoral?"<p class='dim' style='text-align:center;margin-top:16px;font-size:12px'>"+
      U("epiNote")+"</p>":"");
  $("#epi").classList.add("on");
  const stay=document.getElementById("epiStay");
  if(stay) stay.onclick=()=>{ $("#epi").classList.remove("on"); saveGame(); dirty(); };
  const again=document.getElementById("epiAgain");
  if(again) again.onclick=()=>{
    try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_KEY+"_bak"); }catch(e){}
    saveBlocked=false;
    const endings=S.endings;
    S=freshGame(); S.endings=endings;            // the endings you have seen are yours to keep
    $("#ir").max=maxRate(); $("#ir").value=0;
    $("#epi").classList.remove("on");
    dispatch(U("dRefound"),"");
    saveGame(); dirty();
  };
}

   bd:"Chaque transaction est une donnée, chaque donnée un score de risque, et chaque score de risque un prix. L'accès au système suppose désormais d'accepter d'être lu par lui — et l'alternative au système, c'était l'espèce, qu'on retire discrètement de la circulation pour des raisons de sécurité.<br><br>Ils ont échangé la confidentialité contre la commodité. Nous avons comptabilisé la commodité en chiffre d'affaires."},
  d9:{code:"DOSSIER 09",name:"Le ratio du lobbying",goal:"Promulguer 16 doctrines dans un même cycle",
   bd:"Les estimations publiées situent le retour sur un budget de lobbying bien placé dans un rapport de plusieurs centaines pour un — une exception ici, une date d'entrée en vigueur repoussée là. Aucune autre ligne du métier n'en approche.<br><br>Nous avons cessé de l'inscrire en charges. C'est désormais, à juste titre, un investissement."},
  d10:{code:"DOSSIER 10",name:"Le théâtre du plafond de la dette",goal:"Déclencher 4 crises au total",
   bd:"L'échéance est réelle, l'affolement est programmé, et l'accord de sortie était rédigé avant le début de la dispute. Deux semaines d'angoisse télévisée, une signature, et un cliquet permanent en faveur de celui qui ouvre le tour suivant.<br><br>Nous sommes longs sur la volatilité et longs sur l'accord. Aucune position ne nous fait perdre."},
  d11:{code:"DOSSIER 11",name:"L'indice lui-même",goal:"Posséder 20 annexes de banque centrale",
   bd:"Un comité fixe l'indice qui tarife la moitié des contrats du monde. Le comité est composé des parties dont il tarife les contrats, et ses contributions sont des estimations plutôt que des transactions — des opinions, déposées comme des faits.<br><br>Quand cela a été corrigé, la correction a consisté à nommer un autre comité."},
  d12:{code:"DOSSIER 12",name:"Le modèle dit non",goal:"Posséder 15 facilités intergénérationnelles",
   bd:"L'éligibilité est décidée par un modèle. Le modèle est propriétaire, donc inexaminable ; il a été entraîné sur les décisions précédentes, donc il les reproduit ; et parce que c'est un modèle, refuser quelqu'un n'est plus une chose que quiconque a choisie.<br><br>Les recours sont traités par un second modèle, par souci de cohérence."},
  d13:{code:"DOSSIER 13",name:"D'importance systémique",goal:"Atteindre 60 % du capital mondial",
   bd:"Vous êtes désigné d'importance systémique. Cela sonne comme une contrainte et constitue en réalité une garantie : l'État confirmant, par écrit, qu'il n'a pas les moyens de vous laisser tomber.<br><br>Vos coûts de financement baissent le jour de la publication. Personne n'appelle cela une subvention, puisque aucun argent ne change de mains — seulement la certitude."},
  d14:{code:"DOSSIER 14",name:"La dernière contrepartie",goal:"Gagner 7 conflits",
   bd:"Chaque position est couverte auprès de quelqu'un qui est couvert auprès de quelqu'un qui est couvert auprès de vous. Sur le papier, le risque a été réparti jusqu'à presque disparaître.<br><br>Il n'a pas disparu. Il a été disposé en cercle, et vous vous tenez en chacun de ses points."}
